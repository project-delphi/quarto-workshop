[project]
name = "course-feedback"
version = "0.1.0"
description = "One feedback sheet per section of a fictional course, from a SYNTHETIC gradebook."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.0",
    "papermill>=2.7.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
]

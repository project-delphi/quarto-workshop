<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 48" width="236" height="48" role="img" aria-labelledby="acme-logo-title">
  <!-- The logo of Acme Signals, a fictional company, drawn for teaching: it is no real
       company's mark. A navy tile with three rising signal bars, then the wordmark.
       Colours are _brand.yml's navy, paper and ink. -->
  <title id="acme-logo-title">Acme Signals</title>
  <rect x="2" y="4" width="40" height="40" rx="8" fill="#0b3d63"/>
  <rect x="10" y="28" width="6" height="9" rx="1.5" fill="#fbfaf7"/>
  <rect x="19" y="21" width="6" height="16" rx="1.5" fill="#fbfaf7"/>
  <rect x="28" y="13" width="6" height="24" rx="1.5" fill="#fbfaf7"/>
  <text x="52" y="33" fill="#1b2733" font-family="Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700">Acme <tspan fill="#0b3d63">Signals</tspan></text>
</svg>

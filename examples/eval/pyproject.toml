[project]
name = "acme-eval"
version = "0.1.0"
description = "Evaluation of the contact-ranking model of Acme Signals, a fictional company."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "papermill>=2.7.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pypdf>=7.1.0",
    "pytest>=9.0.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

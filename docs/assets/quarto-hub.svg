<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="hub-title hub-desc">
  <title id="hub-title">Quarto turns Markdown into many formats</title>
  <desc id="hub-desc">Two inputs, a .md Markdown file and a .qmd file with code in Python, R, bash, SQL, MATLAB, Java, JavaScript or C, flow into Quarto, shown by its four-quadrant logo, which combines Pandoc with Jupyter and knitr. Quarto produces four groups of formats: documents (html, pdf, docx, odt and, highlighted, epub); presentations (revealjs, pptx, beamer); the web (website, blog, dashboard); and more (Markdown, Jupyter notebooks, JATS, wikis).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86cce8"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f0f0; }
    .label { font-size: 26px; font-weight: 600; }
    .head { font-size: 25px; font-weight: 700; }
    .items { font-size: 20.5px; fill: #d8dee4; }
    .small { font-size: 18px; fill: #b8c2cc; }
    .chip { fill: #e6ebf0; }
    .chip-emoji { font-size: 18px; }
    .chip-name { font-size: 16px; font-weight: 600; fill: #1d1d1d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: rgba(255,255,255,0.07); stroke-width: 2.5; }
    .spoke { stroke: #86cce8; stroke-width: 2.5; fill: none; }
    .hot { fill: #e9b86e; font-weight: 700; }
  </style>

  <!-- Inputs -->
  <rect class="card" x="16" y="104" width="300" height="96" rx="14" stroke="#b9a0ed"/>
  <text class="label mono" x="40" y="146">.md</text>
  <text class="small" x="40" y="178">plain Markdown</text>
  <rect class="card" x="16" y="236" width="300" height="204" rx="14" stroke="#b9a0ed"/>
  <text class="label mono" x="40" y="276">.qmd</text>
  <text class="small" x="112" y="275">Markdown + code</text>
  <!-- Code languages as light chips, so the grey ® and © glyphs stay visible. -->
  <rect class="chip" x="34" y="292" width="98" height="36" rx="18"/><text class="chip-emoji" x="43" y="317">🐍</text><text class="chip-name" x="68" y="316">python</text>
  <rect class="chip" x="140" y="292" width="54" height="36" rx="18"/><text class="chip-emoji" x="149" y="317">®️</text><text class="chip-name" x="174" y="316">R</text>
  <rect class="chip" x="202" y="292" width="80" height="36" rx="18"/><text class="chip-emoji" x="211" y="317">🐚</text><text class="chip-name" x="236" y="316">bash</text>
  <rect class="chip" x="34" y="336" width="70" height="36" rx="18"/><text class="chip-emoji" x="43" y="361">🗄️</text><text class="chip-name" x="68" y="360">sql</text>
  <rect class="chip" x="112" y="336" width="98" height="36" rx="18"/><text class="chip-emoji" x="121" y="361">🧮</text><text class="chip-name" x="146" y="360">matlab</text>
  <rect class="chip" x="218" y="336" width="80" height="36" rx="18"/><text class="chip-emoji" x="227" y="361">☕</text><text class="chip-name" x="252" y="360">java</text>
  <rect class="chip" x="34" y="380" width="134" height="36" rx="18"/><text class="chip-emoji" x="43" y="405">🟨</text><text class="chip-name" x="68" y="404">javascript</text>
  <rect class="chip" x="176" y="380" width="55" height="36" rx="18"/><text class="chip-emoji" x="185" y="405">©️</text><text class="chip-name" x="210" y="404">C</text>
  <path class="spoke" d="M316,152 C352,152 360,236 386,250" marker-end="url(#arrow)"/>
  <path class="spoke" d="M316,338 C352,338 360,304 386,290" marker-end="url(#arrow)"/>

  <!-- Hub with the official Quarto mark (quarto-dev/quarto-web assets/images/quarto-icon.svg). -->
  <circle cx="502" cy="270" r="118" fill="rgba(134,204,232,0.14)" stroke="#86cce8" stroke-width="4"/>
  <g transform="translate(460,166) scale(0.7)" fill="#74AADB" fill-rule="evenodd">
    <path d="M55.8,56.8V1C26.1,3.1,2.6,27.1,1,56.8H55.8z"/>
    <path d="M63.2,56.8H119C117.4,26.8,93.2,2.6,63.2,1V56.8z"/>
    <path d="M55.8,64.2H1.1c2.1,29.2,25.4,52.6,54.6,54.6V64.2z"/>
    <path d="M63.2,64.2V119c29.7-1.6,53.7-25.1,55.7-54.7H63.2z"/>
  </g>
  <text x="502" y="296" text-anchor="middle" style="font-size:36px;font-weight:700">Quarto</text>
  <text class="small" x="502" y="324" text-anchor="middle" style="font-size:16.5px">Pandoc + Jupyter · knitr</text>

  <!-- Spokes to the four format groups -->
  <path class="spoke" d="M590,192 C640,140 655,90 696,90" marker-end="url(#arrow)"/>
  <path class="spoke" d="M614,236 C650,222 665,210 696,210" marker-end="url(#arrow)"/>
  <path class="spoke" d="M614,304 C650,318 665,330 696,330" marker-end="url(#arrow)"/>
  <path class="spoke" d="M590,348 C640,400 655,450 696,450" marker-end="url(#arrow)"/>

  <!-- Format groups, as on quarto.org/docs/output-formats/all-formats.html -->
  <rect class="card" x="700" y="40" width="388" height="100" rx="16" stroke="#86cce8"/>
  <text class="head" x="722" y="80">📄 Documents</text>
  <text class="items" x="722" y="118">html · pdf · docx · odt · <tspan class="hot">📖 epub</tspan></text>

  <rect class="card" x="700" y="160" width="388" height="100" rx="16" stroke="#b9a0ed"/>
  <text class="head" x="722" y="200">🎞️ Presentations</text>
  <text class="items" x="722" y="238">revealjs · pptx · beamer</text>

  <rect class="card" x="700" y="280" width="388" height="100" rx="16" stroke="#79d4b2"/>
  <text class="head" x="722" y="320">🌐 Web</text>
  <text class="items" x="722" y="358">website · blog · dashboard</text>

  <rect class="card" x="700" y="400" width="388" height="100" rx="16" stroke="#b8c2cc"/>
  <text class="head" x="722" y="440">🧩 And more</text>
  <text class="items" x="722" y="478">markdown · ipynb · jats · wikis · …</text>
</svg>

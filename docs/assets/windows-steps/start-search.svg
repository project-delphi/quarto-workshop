<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Windows Start button and search</title>
<desc id="d">A drawing of the Windows desktop. The Start button, the four-square Windows logo in the middle of the bottom taskbar, is circled. Above it the search panel has PowerShell typed in the box and Windows PowerShell as the best match.</desc>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.m{font-family:Consolas,Menlo,ui-monospace,monospace}
.hl{fill:none;stroke:#ffb000;stroke-width:5}
.tag{fill:#ffb000}
.tagt{font-size:20px;font-weight:700;fill:#1b1b1b}
</style>
<rect width="900" height="520" rx="12" fill="#1f3a5f"/>
<!-- search panel -->
<rect x="270" y="130" width="360" height="300" rx="10" fill="#2b2f36" stroke="#444a54"/>
<rect x="286" y="146" width="328" height="40" rx="20" fill="#1b1d21" stroke="#4cc2ff" stroke-width="2"/>
<text x="312" y="173" font-size="18" fill="#e8e8e8">PowerShell</text>
<text x="290" y="222" font-size="14" fill="#9aa3ad">Best match</text>
<rect x="286" y="232" width="328" height="72" rx="8" fill="#3a4a63"/>
<rect x="298" y="246" width="44" height="44" rx="6" fill="#012456"/>
<text x="305" y="276" font-size="20" font-weight="700" fill="#fff" class="m">&gt;_</text>
<text x="354" y="265" font-size="18" fill="#fff">Windows PowerShell</text>
<text x="354" y="287" font-size="14" fill="#c4ccd6">App</text>
<!-- taskbar -->
<rect x="0" y="472" width="900" height="48" fill="#202327"/>
<circle cx="450" cy="496" r="26" class="hl"/>
<g fill="#4cc2ff">
<rect x="438" y="484" width="11" height="11"/><rect x="451" y="484" width="11" height="11"/>
<rect x="438" y="497" width="11" height="11"/><rect x="451" y="497" width="11" height="11"/>
</g>
<rect x="500" y="482" width="210" height="28" rx="14" fill="#2f343b"/>
<text x="520" y="502" font-size="14" fill="#9aa3ad">Search</text>
<!-- labels -->
<rect x="140" y="400" width="270" height="36" rx="6" class="tag"/>
<text x="156" y="425" class="tagt">1  Press the Windows key</text>
<rect x="640" y="148" width="230" height="36" rx="6" class="tag"/>
<text x="656" y="173" class="tagt">2  Type PowerShell</text>
</svg>

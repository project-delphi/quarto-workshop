<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 828" role="img" aria-labelledby="t d">
<title id="t">Dónde estamos</title>
<desc id="d">Dónde estamos: Parte I: Empieza aquí, resaltada entre las cinco partes del libro. Sus capítulos en orden: 1, Publicar algo que se reconstruye solo, lees: por qué una sola fuente es mejor que las copias; 2, Trabajar con un agente de programación, lees: cómo pedir trabajo y revisarlo; 3, La vía rápida, construyes: un informe en tres formatos, revisado como pull request, termina en el punto de control 14; 4, Preparar tu computadora, construyes: una computadora que renderiza la prueba; 5, Un primer informe, a mano, construyes: un informe que revisas, corriges y guardas en Git.</desc>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 28px; font-weight: 700; }
  .t { font-size: 24px; font-weight: 600; }
  .s { font-size: 20px; }
  .g { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .num { font-size: 22px; font-weight: 700; fill: #ffffff; }
  .on { fill: #ffffff; font-weight: 700; }
</style>
<rect x="20" y="20" width="122" height="48" rx="24" fill="#24313f" stroke="#5b6b7b" stroke-width="2"/><text x="81" y="51" text-anchor="middle" class="s on">Parte I</text><rect x="154" y="20" width="122" height="48" rx="24" fill="none" stroke="#5b6b7b" stroke-width="2"/><text x="216" y="51" text-anchor="middle" class="s">Parte II</text><rect x="289" y="20" width="122" height="48" rx="24" fill="none" stroke="#5b6b7b" stroke-width="2"/><text x="350" y="51" text-anchor="middle" class="s">Parte III</text><rect x="423" y="20" width="122" height="48" rx="24" fill="none" stroke="#5b6b7b" stroke-width="2"/><text x="484" y="51" text-anchor="middle" class="s">Parte IV</text><rect x="558" y="20" width="122" height="48" rx="24" fill="none" stroke="#5b6b7b" stroke-width="2"/><text x="619" y="51" text-anchor="middle" class="s">Parte V</text>
<text x="20" y="112" class="h">Empieza aquí</text>
<circle cx="52" cy="172" r="24" fill="#2f72b0"/><text x="52" y="180" text-anchor="middle" class="num">1</text><text x="96" y="180" class="t">Publicar algo que se reconstruye</text><text x="96" y="214" class="t">solo</text><text x="96" y="244" class="g">Lees: por qué una sola fuente es mejor que las</text><text x="96" y="274" class="g">copias</text><line x1="52" y1="196" x2="52" y2="302" stroke="#c3ccd5" stroke-width="4"/><circle cx="52" cy="326" r="24" fill="#b07a14"/><text x="52" y="334" text-anchor="middle" class="num">2</text><text x="96" y="334" class="t">Trabajar con un agente de</text><text x="96" y="368" class="t">programación</text><text x="96" y="398" class="g">Lees: cómo pedir trabajo y revisarlo</text><line x1="52" y1="350" x2="52" y2="426" stroke="#c3ccd5" stroke-width="4"/><circle cx="52" cy="450" r="24" fill="#7c5cdb"/><text x="52" y="458" text-anchor="middle" class="num">3</text><text x="96" y="458" class="t">La vía rápida</text><text x="96" y="488" class="g">Construyes: un informe en tres formatos, revisado</text><text x="96" y="518" class="g">como pull request</text><text x="96" y="548" class="n">termina en el punto de control 14</text><line x1="52" y1="474" x2="52" y2="576" stroke="#c3ccd5" stroke-width="4"/><circle cx="52" cy="600" r="24" fill="#2f9e77"/><text x="52" y="608" text-anchor="middle" class="num">4</text><text x="96" y="608" class="t">Preparar tu computadora</text><text x="96" y="638" class="g">Construyes: una computadora que renderiza la</text><text x="96" y="668" class="g">prueba</text><line x1="52" y1="624" x2="52" y2="696" stroke="#c3ccd5" stroke-width="4"/><circle cx="52" cy="720" r="24" fill="#c2416b"/><text x="52" y="728" text-anchor="middle" class="num">5</text><text x="96" y="728" class="t">Un primer informe, a mano</text><text x="96" y="758" class="g">Construyes: un informe que revisas, corriges y</text><text x="96" y="788" class="g">guardas en Git</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" role="img" aria-labelledby="t d">
<title id="t">Cómo funciona un agente de programación</title>
<desc id="d">Tú le das un prompt al harness, y este te muestra los resultados y te pide aprobar comandos. El harness (Claude Code, Codex o Antigravity) le envía la conversación y los resultados de las herramientas al modelo (Claude, GPT o Gemini), que corre en los servidores del proveedor y responde con texto o con una solicitud para usar una herramienta. El harness lleva a cabo las solicitudes en la carpeta del proyecto, su raíz: primero lee AGENTS.md y luego lee y edita archivos y ejecuta comandos ahí. El modelo decide, el harness hace, y tú diriges y revisas.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 26px; font-weight: 700; }
  .s { font-size: 21px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
</style>
<!-- you -->
<rect x="190" y="14" width="320" height="96" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="350" y="55" text-anchor="middle" class="h">Tú</text>
<text x="350" y="88" text-anchor="middle" class="s">diriges y revisas</text>
<path class="arrow" d="M260,110 L260,176"/>
<text x="250" y="150" text-anchor="end" class="n">prompt</text>
<path class="arrow" d="M440,176 L440,110"/>
<text x="452" y="140" class="n">resultados,</text>
<text x="452" y="162" class="n">"¿apruebas esto?"</text>
<!-- harness -->
<rect x="30" y="180" width="410" height="250" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="56" y="220" class="h">Harness</text>
<text x="56" y="250" class="n">Claude Code · Codex · Antigravity</text>
<text x="56" y="292" class="s">lee y escribe archivos</text>
<text x="56" y="324" class="s">ejecuta comandos</text>
<text x="56" y="356" class="s">busca</text>
<text x="56" y="388" class="s">pregunta antes de actuar</text>
<!-- model -->
<rect x="500" y="200" width="180" height="210" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="590" y="240" text-anchor="middle" class="h">Modelo</text>
<text x="590" y="274" text-anchor="middle" class="s">Claude, GPT</text>
<text x="590" y="300" text-anchor="middle" class="s">o Gemini</text>
<text x="590" y="340" text-anchor="middle" class="n">en los servidores</text>
<text x="590" y="364" text-anchor="middle" class="n">del proveedor</text>
<path class="arrow" d="M440,262 L496,262"/>
<path class="arrow" d="M500,352 L444,352"/>
<!-- loop labels -->
<!-- folder -->
<path class="arrow" d="M150,430 L150,546"/>
<text x="162" y="528" class="n">edita, ejecuta</text>
<path class="arrow" d="M350,546 L350,430"/>
<text x="362" y="528" class="n">primero lee AGENTS.md</text>
<rect x="30" y="550" width="640" height="170" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="56" y="590" class="h">Carpeta del proyecto, la raíz</text>
<text x="56" y="630" class="m s">AGENTS.md</text><text x="260" y="630" class="m s">london.qmd</text>
<text x="56" y="662" class="m s">data/</text><text x="260" y="662" class="m s">images/</text>
<text x="56" y="698" class="n">el mundo del agente: inícialo aquí</text>
<text x="350" y="772" text-anchor="middle" class="s">El modelo decide · el harness hace · tú revisas</text>
</svg>

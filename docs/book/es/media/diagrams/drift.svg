<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 990" role="img" aria-labelledby="t d">
<title id="t">Por qué los informes se desactualizan</title>
<desc id="d">Dos maneras de publicar los conteos de atracciones de la guía de Londres después de que ALVA corrige una cifra en attractions.csv. A mano: cada número se copia en cada salida, una por una, así que la guía web y el dashboard reciben el número nuevo mientras el informe en Word, la tarjeta para redes sociales y el documento técnico siguen mostrando el viejo. Una sola fuente: las celdas de código de las páginas .qmd del proyecto leen attractions.csv, y un solo quarto render reconstruye la guía web, el dashboard, el informe en Word, la tarjeta para redes sociales y el documento técnico, todos con el número corregido.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 27px; font-weight: 700; }
  .b { font-size: 23px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .p { font-size: 20px; text-anchor: middle; }
  .ok { fill: #1f7a5a; font-weight: 700; }
  .old { fill: #b85a16; font-weight: 700; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .good { fill: #e3f4ed; stroke: #2f9e77; stroke-width: 2; }
  .stale { fill: #fdeee2; stroke: #d0752b; stroke-width: 2; stroke-dasharray: 7 5; }
  .data { fill: #fbf1de; stroke: #b07a14; stroke-width: 2.5; }
</style>
<!-- By hand -->
<text x="20" y="40" class="h">A mano</text>
<text x="20" y="70" class="n">cada número se copia en cada salida</text>
<rect class="data" x="200" y="92" width="300" height="80" rx="12"/>
<text x="350" y="126" text-anchor="middle" class="m s">attractions.csv</text>
<text x="350" y="157" text-anchor="middle" class="n">ALVA corrige una cifra</text>
<path class="arrow" d="M350,172 L350,236"/>
<text x="364" y="212" class="n">reescrito a mano, una a la vez</text>
<rect class="good" x="20" y="240" width="206" height="54" rx="27"/>
<text x="123" y="274" class="p"><tspan class="ok">✓</tspan> guía web</text>
<rect class="good" x="247" y="240" width="206" height="54" rx="27"/>
<text x="350" y="274" class="p"><tspan class="ok">✓</tspan> dashboard</text>
<rect class="stale" x="474" y="240" width="206" height="54" rx="27"/>
<text x="577" y="274" class="p"><tspan class="old">✗</tspan> informe Word</text>
<rect class="stale" x="133" y="310" width="206" height="54" rx="27"/>
<text x="236" y="344" class="p"><tspan class="old">✗</tspan> tarjeta social</text>
<rect class="stale" x="360" y="310" width="206" height="54" rx="27"/>
<text x="463" y="344" class="p"><tspan class="old">✗</tspan> doc. técnico</text>
<text x="350" y="400" text-anchor="middle" class="n"><tspan class="ok">✓</tspan> número nuevo   <tspan class="old">✗</tspan> sigue el viejo</text>
<line x1="20" y1="436" x2="680" y2="436" stroke="#c3ccd5" stroke-width="2"/>
<!-- One source -->
<text x="20" y="484" class="h">Una sola fuente</text>
<text x="20" y="514" class="n">cada número se calcula a partir de los datos</text>
<rect class="data" x="200" y="536" width="300" height="80" rx="12"/>
<text x="350" y="570" text-anchor="middle" class="m s">attractions.csv</text>
<text x="350" y="601" text-anchor="middle" class="n">ALVA corrige una cifra</text>
<path class="arrow" d="M350,616 L350,664"/>
<text x="364" y="646" class="n">lo leen las celdas de código</text>
<rect x="170" y="668" width="360" height="80" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="350" y="702" text-anchor="middle" class="b">Las páginas del proyecto</text>
<text x="350" y="733" text-anchor="middle" class="n"><tspan class="m">.qmd</tspan>: las fuentes que editas y revisas</text>
<path class="arrow" d="M350,748 L350,812"/>
<text x="364" y="788" class="m n">quarto render</text>
<rect class="good" x="20" y="816" width="206" height="54" rx="27"/>
<text x="123" y="850" class="p"><tspan class="ok">✓</tspan> guía web</text>
<rect class="good" x="247" y="816" width="206" height="54" rx="27"/>
<text x="350" y="850" class="p"><tspan class="ok">✓</tspan> dashboard</text>
<rect class="good" x="474" y="816" width="206" height="54" rx="27"/>
<text x="577" y="850" class="p"><tspan class="ok">✓</tspan> informe Word</text>
<rect class="good" x="133" y="886" width="206" height="54" rx="27"/>
<text x="236" y="920" class="p"><tspan class="ok">✓</tspan> tarjeta social</text>
<rect class="good" x="360" y="886" width="206" height="54" rx="27"/>
<text x="463" y="920" class="p"><tspan class="ok">✓</tspan> doc. técnico</text>
<text x="350" y="976" text-anchor="middle" class="n">cada salida, actualizada con un solo comando</text>
</svg>

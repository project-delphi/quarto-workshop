<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="t d">
<title id="t">Publishing to GitHub Pages</title>
<desc id="d">Your project folder holds the source, which git pushes to the main branch of a GitHub repository. quarto publish gh-pages renders the site on your computer and pushes only the rendered HTML to a separate branch, gh-pages. GitHub Pages serves that branch at https://user.github.io/repo/. Anyone with the address can read the site.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 19px; }
  .h { font-size: 24px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
</style>
<rect x="20" y="20" width="660" height="150" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="44" y="58" class="h">Your project folder</text>
<text x="44" y="94" class="s">source: <tspan class="m">.qmd</tspan>, <tspan class="m">data/</tspan>, <tspan class="m">_quarto.yml</tspan></text>
<text x="44" y="126" class="s">rendered site: <tspan class="m">_site/</tspan> (not committed)</text>
<path class="arrow" d="M180,170 L180,236"/>
<text x="192" y="210" class="m">git push</text>
<path class="arrow" d="M520,170 L520,236"/>
<text x="508" y="196" text-anchor="end" class="m">quarto publish</text>
<text x="508" y="220" text-anchor="end" class="m">gh-pages</text>
<rect x="20" y="240" width="660" height="210" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="44" y="278" class="h">GitHub repository</text>
<rect x="44" y="300" width="280" height="120" rx="10" fill="#ffffff" stroke="#2f72b0" stroke-width="1.5"/>
<text x="184" y="340" text-anchor="middle" class="m">main</text>
<text x="184" y="372" text-anchor="middle" class="n">the source and</text>
<text x="184" y="396" text-anchor="middle" class="n">its history</text>
<rect x="376" y="300" width="280" height="120" rx="10" fill="#ffffff" stroke="#2f72b0" stroke-width="1.5"/>
<text x="516" y="340" text-anchor="middle" class="m">gh-pages</text>
<text x="516" y="372" text-anchor="middle" class="n">rendered HTML only,</text>
<text x="516" y="396" text-anchor="middle" class="n">written by Quarto</text>
<path class="arrow" d="M516,420 L516,516"/>
<text x="528" y="476" class="n">served by</text>
<text x="528" y="498" class="n">GitHub Pages</text>
<rect x="160" y="520" width="520" height="110" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="420" y="560" text-anchor="middle" class="h">The live site</text>
<text x="420" y="596" text-anchor="middle" class="m">https://user.github.io/repo/</text>
<text x="350" y="676" text-anchor="middle" class="n">Free static hosting: anyone with the address can read it.</text>
</svg>

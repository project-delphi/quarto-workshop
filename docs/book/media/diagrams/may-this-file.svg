<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="t d">
<title id="t">May this file go to this agent?</title>
<desc id="d">A decision path with two questions. Question 1: is the file public, or yours to share? If yes, go on to question 2: is this agent, on this plan, approved for this file? If yes to both, the agent may work on the file. If the answer to either question is no, build on a synthetic stand-in, a made-up file with the real file's columns and none of its rows, and render the real file yourself. The check is about the file and the plan, not about your intentions.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 22px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
</style>
<rect x="20" y="20" width="360" height="100" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="44" y="56" class="h">1. The file</text>
<text x="44" y="92" class="s">Is it public, or yours to share?</text>
<path class="arrow" d="M200,120 L200,200"/>
<text x="214" y="168" class="n">yes</text>
<rect x="20" y="200" width="360" height="110" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="44" y="236" class="h">2. The agent</text>
<text x="44" y="268" class="s">Is this agent, on this plan,</text>
<text x="44" y="294" class="s">approved for this file?</text>
<path class="arrow" d="M200,310 L200,390"/>
<text x="214" y="358" class="n">yes</text>
<rect x="20" y="390" width="360" height="90" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="44" y="426" class="h">Go ahead</text>
<text x="44" y="458" class="s">The agent may use the file.</text>
<path class="arrow" d="M380,70 L452,70"/>
<text x="416" y="58" text-anchor="middle" class="n">no</text>
<path class="arrow" d="M380,255 L452,255"/>
<text x="416" y="243" text-anchor="middle" class="n">no</text>
<rect x="456" y="20" width="224" height="290" rx="12" fill="#fdf1dc" stroke="#d9890b" stroke-width="2.5"/>
<text x="476" y="56" class="h">Keep it out</text>
<text x="476" y="94" class="s">Build on a</text>
<text x="476" y="120" class="s">synthetic stand-in:</text>
<text x="476" y="146" class="s">the real columns,</text>
<text x="476" y="172" class="s">none of its rows.</text>
<text x="476" y="214" class="s">Render the real</text>
<text x="476" y="240" class="s">file yourself.</text>
<text x="350" y="530" text-anchor="middle" class="n">The questions are about the file and the plan, not your intentions.</text>
</svg>

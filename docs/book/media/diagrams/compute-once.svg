<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="t d">
<title id="t">Compute once, publish many</title>
<desc id="d">The data file water_municipal.csv feeds one script, scripts/analysis.py, which Quarto runs before every render. The script prepares the features, chooses k, fits k-means, and computes cluster profiles and outcome comparisons, then writes them once to outputs/: clusters.parquet, cluster_profiles.csv, k_selection.csv, outcomes_by_year.csv, irca_infant.csv and summary.json. Every page reads those files and none recomputes them: the explore and clusters pages, the report in html, docx, pdf and epub, the council slides in revealjs and pptx, a blog post and a dashboard. Together they are one website, published on GitHub Pages.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 19px; }
  .ms { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 17px; fill: #3d4b59; }
  .h { font-size: 24px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 18px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .pill { fill: #f1f3f5; stroke: #5b6b7b; stroke-width: 1.5; }
</style>
<rect x="150" y="14" width="400" height="76" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="350" y="50" text-anchor="middle" class="m">data/water_municipal.csv</text>
<text x="350" y="76" text-anchor="middle" class="n">real public data, unchanged</text>
<path class="arrow" d="M350,90 L350,128"/>
<rect x="100" y="132" width="500" height="150" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="350" y="170" text-anchor="middle" class="m">scripts/analysis.py</text>
<text x="350" y="204" text-anchor="middle" class="s">prepare · choose k · fit k-means</text>
<text x="350" y="232" text-anchor="middle" class="s">profiles · outcome comparisons</text>
<text x="350" y="264" text-anchor="middle" class="n">run by Quarto before every render (pre-render)</text>
<path class="arrow" d="M350,282 L350,320"/>
<rect x="60" y="324" width="580" height="170" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="84" y="360" class="m">outputs/</text>
<text x="200" y="360" class="n">written once</text>
<text x="84" y="396" class="ms">clusters.parquet</text>
<text x="360" y="396" class="ms">cluster_profiles.csv</text>
<text x="84" y="428" class="ms">k_selection.csv</text>
<text x="360" y="428" class="ms">outcomes_by_year.csv</text>
<text x="84" y="460" class="ms">irca_infant.csv</text>
<text x="360" y="460" class="ms">summary.json</text>
<path class="arrow" d="M350,494 L350,532"/>
<text x="362" y="520" class="n">every page reads them; none recomputes</text>
<rect x="20" y="536" width="660" height="230" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<g class="m" font-size="18">
  <rect class="pill" x="40" y="556" width="190" height="44" rx="22"/><text x="135" y="584" text-anchor="middle">explore</text>
  <rect class="pill" x="250" y="556" width="190" height="44" rx="22"/><text x="345" y="584" text-anchor="middle">clusters</text>

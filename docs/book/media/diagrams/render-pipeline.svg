<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 830" role="img" aria-labelledby="t d">
<title id="t">What quarto render does</title>
<desc id="d">A source file, london.qmd, holding Markdown, YAML and code cells, goes through three steps. Step 1, execute: Jupyter for Python or knitr for R runs each code cell. The result is Markdown with the results in place of the code. Step 2, convert: Pandoc turns that Markdown into html, docx, epub, pptx and revealjs. Step 3, typeset: for PDF, Pandoc writes Typst source and Typst typesets it into a pdf. One command, quarto render, runs all three steps.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 26px; font-weight: 700; }
  .s { font-size: 21px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .pill { fill: #f1f3f5; stroke: #5b6b7b; stroke-width: 1.5; }
  .p { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 21px; text-anchor: middle; }
</style>
<!-- source -->
<rect x="190" y="14" width="320" height="104" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="350" y="56" text-anchor="middle" class="m h">london.qmd</text>
<text x="350" y="92" text-anchor="middle" class="s">Markdown · YAML · code cells</text>
<path class="arrow" d="M350,118 L350,152"/>
<!-- execute -->
<rect x="150" y="156" width="400" height="120" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="350" y="196" text-anchor="middle" class="h">1 Execute</text>
<text x="350" y="230" text-anchor="middle" class="s">Jupyter (Python) or knitr (R)</text>
<text x="350" y="260" text-anchor="middle" class="n">runs each code cell</text>
<path class="arrow" d="M350,276 L350,310"/>
<!-- intermediate -->
<rect x="170" y="314" width="360" height="62" rx="31" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="350" y="353" text-anchor="middle" class="s">Markdown with results</text>
<path class="arrow" d="M300,376 C300,400 195,400 195,428"/>
<!-- convert -->
<rect x="30" y="432" width="330" height="110" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="195" y="474" text-anchor="middle" class="h">2 Convert</text>
<text x="195" y="512" text-anchor="middle" class="s">Pandoc</text>
<!-- typeset -->
<path class="arrow" d="M360,487 L418,487"/>
<text x="389" y="474" text-anchor="middle" class="n">.typ</text>
<rect x="422" y="432" width="248" height="110" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="546" y="474" text-anchor="middle" class="h">3 Typeset</text>
<text x="546" y="512" text-anchor="middle" class="s">Typst</text>
<!-- outputs -->
<path class="arrow" d="M195,542 L195,578"/>
<rect x="22" y="582" width="346" height="136" rx="14" fill="none" stroke="#2f72b0" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect class="pill" x="36" y="596" width="100" height="46" rx="23"/><text class="p" x="86" y="626">html</text>
<rect class="pill" x="145" y="596" width="100" height="46" rx="23"/><text class="p" x="195" y="626">docx</text>
<rect class="pill" x="254" y="596" width="100" height="46" rx="23"/><text class="p" x="304" y="626">epub</text>
<rect class="pill" x="36" y="656" width="100" height="46" rx="23"/><text class="p" x="86" y="686">pptx</text>
<rect class="pill" x="145" y="656" width="209" height="46" rx="23"/><text class="p" x="249" y="686">revealjs</text>
<path class="arrow" d="M546,542 L546,592"/>
<rect class="pill" x="496" y="596" width="100" height="46" rx="23"/><text class="p" x="546" y="626">pdf</text>
<!-- caption -->
<text x="350" y="772" text-anchor="middle" class="s">One command, <tspan class="m">quarto render</tspan>, runs every step;</text>
<text x="350" y="806" text-anchor="middle" class="s"><tspan class="m">quarto preview</tspan> reruns them on each save.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img" aria-labelledby="t d">
<title id="t">One lead, three sub-agents</title>
<desc id="d">Your assistant, the lead, reads the prompt and starts three sub-agents at once. Each has its own context and writes only its own files: one writes london-dashboard.qmd, one london-email.qmd and london-email-message.md, one london-flyer.qmd. None of them renders. When all three report back, the lead renders the three files one at a time and checks each. Three tasks take about as long as the slowest one, and use more tokens.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 19px; }
  .h { font-size: 25px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
</style>
<rect x="150" y="14" width="400" height="104" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="350" y="54" text-anchor="middle" class="h">Lead: your assistant</text>
<text x="350" y="88" text-anchor="middle" class="s">splits the work and waits</text>
<path class="arrow" d="M250,118 C250,150 120,150 120,190"/>
<path class="arrow" d="M350,118 L350,190"/>
<path class="arrow" d="M450,118 C450,150 580,150 580,190"/>
<text x="362" y="164" class="n">all at once</text>
<!-- sub-agents -->
<g>
  <rect x="20" y="194" width="200" height="200" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2"/>
  <text x="120" y="230" text-anchor="middle" class="h">Sub-agent 1</text>
  <text x="120" y="262" text-anchor="middle" class="n">own context</text>
  <text x="120" y="380" text-anchor="middle" class="n">renders nothing</text>
  <text x="120" y="304" text-anchor="middle" class="m">london-</text>
  <text x="120" y="326" text-anchor="middle" class="m">dashboard.qmd</text>
</g>
<g>
  <rect x="250" y="194" width="200" height="200" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2"/>
  <text x="350" y="230" text-anchor="middle" class="h">Sub-agent 2</text>
  <text x="350" y="262" text-anchor="middle" class="n">own context</text>
  <text x="350" y="380" text-anchor="middle" class="n">renders nothing</text>
  <text x="350" y="304" text-anchor="middle" class="m">london-email.qmd</text>
  <text x="350" y="334" text-anchor="middle" class="m">london-email-</text>
  <text x="350" y="356" text-anchor="middle" class="m">message.md</text>
</g>
<g>
  <rect x="480" y="194" width="200" height="200" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2"/>
  <text x="580" y="230" text-anchor="middle" class="h">Sub-agent 3</text>
  <text x="580" y="262" text-anchor="middle" class="n">own context</text>
  <text x="580" y="380" text-anchor="middle" class="n">renders nothing</text>
  <text x="580" y="304" text-anchor="middle" class="m">london-</text>
  <text x="580" y="326" text-anchor="middle" class="m">flyer.qmd</text>
</g>
<path class="arrow" d="M120,394 C120,480 260,470 300,512"/>
<path class="arrow" d="M350,394 L350,512"/>
<path class="arrow" d="M580,394 C580,480 440,470 400,512"/>
<rect x="110" y="516" width="480" height="134" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="350" y="556" text-anchor="middle" class="h">Lead renders and checks</text>
<text x="350" y="590" text-anchor="middle" class="s">one file at a time:</text>
<text x="350" y="620" text-anchor="middle" class="s">two renders in one folder collide</text>
<text x="350" y="700" text-anchor="middle" class="s">time ≈ the slowest task · more tokens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="t d">
<title id="t">What else could explain it</title>
<desc id="d">The question is whether unsafe water raises infant mortality, a dashed arrow from water safety to infant deaths. Other paths connect the two. Poverty and rurality make water less safe and also make infant deaths more likely, so they can create an association without any effect of water: a confounder. Poverty also limits health-service access, which affects infant deaths. And poverty weakens reporting quality: places with weak registration record fewer of their real deaths, and blank rates are left out of the data, which can hide a real effect. Finally the data meet at different levels: IRCA is measured for a zone, infant mortality for the whole municipality, so a pattern across places need not hold for the people in them.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2416b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 23px; font-weight: 700; }
  .s { font-size: 19px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .ql { font-size: 19px; font-weight: 600; fill: #c2416b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .q { stroke: #c2416b; stroke-width: 3; fill: none; marker-end: url(#q); stroke-dasharray: 8 6; }
</style>
<!-- the confounder and its paths -->
<rect x="200" y="14" width="300" height="86" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="350" y="50" text-anchor="middle" class="h">Poverty, rurality</text>
<text x="350" y="80" text-anchor="middle" class="n">a confounder: touches both</text>
<path class="arrow" d="M235,100 C190,150 175,190 172,236"/>
<path class="arrow" d="M470,100 C560,115 640,150 640,236"/>
<path class="arrow" d="M350,100 L350,124"/>
<path class="arrow" d="M200,57 C40,57 40,150 40,416"/>
<rect x="250" y="128" width="200" height="72" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
<text x="350" y="158" text-anchor="middle" class="h">Health-service</text>
<text x="350" y="186" text-anchor="middle" class="h">access</text>
<path class="arrow" d="M450,180 C500,190 530,205 545,236"/>
<!-- the question -->
<rect x="70" y="240" width="200" height="100" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="170" y="280" text-anchor="middle" class="h">Water safety</text>
<text x="170" y="312" text-anchor="middle" class="s">IRCA, per zone</text>
<rect x="470" y="240" width="210" height="100" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="575" y="280" text-anchor="middle" class="h">Infant deaths</text>
<text x="575" y="312" text-anchor="middle" class="s">real, per municipality</text>
<path class="q" d="M270,310 L464,310"/>
<text x="368" y="296" text-anchor="middle" class="ql">the question?</text>
<!-- what the data hold -->
<path class="arrow" d="M600,340 L600,416"/>
<rect x="20" y="420" width="310" height="96" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
<text x="175" y="458" text-anchor="middle" class="h">Reporting quality</text>
<text x="175" y="490" text-anchor="middle" class="s">weak registration hides deaths</text>
<path class="arrow" d="M330,468 L396,468"/>
<rect x="400" y="420" width="280" height="96" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2" stroke-dasharray="7 5"/>
<text x="540" y="458" text-anchor="middle" class="h">Recorded deaths</text>
<text x="540" y="490" text-anchor="middle" class="s">what the data hold</text>
<text x="540" y="546" text-anchor="middle" class="n">blank rates are left out</text>
<!-- level -->
<rect x="20" y="580" width="660" height="100" rx="12" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="350" y="622" text-anchor="middle" class="s">Ecological level: IRCA per zone, deaths per municipality.</text>
<text x="350" y="654" text-anchor="middle" class="n">A pattern across places need not hold for the people in them.</text>
</svg>

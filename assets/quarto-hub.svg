<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="hub-title hub-desc">
  <title id="hub-title">Quarto turns Markdown into many formats</title>
  <desc id="hub-desc">Two inputs, a .md Markdown file and a .qmd file with Python code, flow into Quarto, which combines Pandoc and Jupyter. Quarto produces docx, pdf, pptx, an HTML website, a blog and a dashboard. An xlsx file is shown with a dashed arrow because a code cell writes it during the render; it is not a native Quarto format.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86cce8"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e9b86e"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f0f0; }
    .label { font-size: 26px; font-weight: 600; }
    .small { font-size: 18px; fill: #b8c2cc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: rgba(255,255,255,0.07); stroke-width: 2.5; }
    .spoke { stroke: #86cce8; stroke-width: 2.5; fill: none; }
  </style>

  <!-- Inputs -->
  <rect class="card" x="20" y="135" width="250" height="90" rx="14" stroke="#b9a0ed"/>
  <text class="label mono" x="45" y="178">.md</text>
  <text class="small" x="45" y="206">plain Markdown</text>
  <rect class="card" x="20" y="315" width="250" height="90" rx="14" stroke="#b9a0ed"/>
  <text class="label mono" x="45" y="358">.qmd  🐍</text>
  <text class="small" x="45" y="386">Markdown + code</text>
  <path class="spoke" d="M270,180 C350,180 360,250 418,262" marker-end="url(#arrow)"/>
  <path class="spoke" d="M270,360 C350,360 360,290 418,280" marker-end="url(#arrow)"/>

  <!-- Hub -->
  <circle cx="530" cy="270" r="110" fill="rgba(134,204,232,0.14)" stroke="#86cce8" stroke-width="4"/>
  <text x="530" y="268" text-anchor="middle" style="font-size:40px;font-weight:700">Quarto</text>
  <text class="small" x="530" y="302" text-anchor="middle">Pandoc + Jupyter</text>

  <!-- Spokes to outputs -->
  <path class="spoke" d="M630,225 C720,120 740,52 800,50" marker-end="url(#arrow)"/>
  <path class="spoke" d="M638,240 C720,170 740,124 800,122" marker-end="url(#arrow)"/>
  <path class="spoke" d="M640,258 C720,215 750,196 800,194" marker-end="url(#arrow)"/>
  <path class="spoke" d="M640,270 L800,266" marker-end="url(#arrow)"/>
  <path class="spoke" d="M640,282 C720,325 750,336 800,338" marker-end="url(#arrow)"/>
  <path class="spoke" d="M638,300 C720,370 740,408 800,410" marker-end="url(#arrow)"/>
  <path d="M630,315 C720,420 740,480 800,482" stroke="#e9b86e" stroke-width="2.5" stroke-dasharray="9 7" fill="none" marker-end="url(#arrow-dashed)"/>

  <!-- Outputs -->
  <g>
    <rect class="card" x="805" y="22" width="280" height="56" rx="28" stroke="#86cce8"/>
    <text class="label" x="830" y="59">📄 docx</text>
    <rect class="card" x="805" y="94" width="280" height="56" rx="28" stroke="#86cce8"/>
    <text class="label" x="830" y="131">📕 pdf</text>
    <rect class="card" x="805" y="166" width="280" height="56" rx="28" stroke="#86cce8"/>
    <text class="label" x="830" y="203">📊 pptx</text>
    <rect class="card" x="805" y="238" width="280" height="56" rx="28" stroke="#86cce8"/>
    <text class="label" x="830" y="275">🌐 html · website</text>
    <rect class="card" x="805" y="310" width="280" height="56" rx="28" stroke="#86cce8"/>
    <text class="label" x="830" y="347">✍️ blog</text>
    <rect class="card" x="805" y="382" width="280" height="56" rx="28" stroke="#86cce8"/>
    <text class="label" x="830" y="419">📈 dashboard</text>
    <rect class="card" x="805" y="454" width="280" height="56" rx="28" stroke="#e9b86e" stroke-dasharray="9 7"/>
    <text class="label" x="830" y="491">📗 xlsx *</text>
  </g>
</svg>

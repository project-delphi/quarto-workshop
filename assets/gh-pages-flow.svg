<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="ghp-title ghp-desc">
  <title id="ghp-title">GitHub Pages in three steps</title>
  <desc id="ghp-desc">Step one, your source lives in a GitHub repository. Step two, quarto publish gh-pages renders the site and pushes the HTML to a gh-pages branch. Step three, GitHub serves that branch at https://user.github.io/repo/.</desc>
  <defs>
    <marker id="ghp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86cce8"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f0f0; }
    .emoji { font-size: 58px; }
    .label { font-size: 28px; font-weight: 600; }
    .small { font-size: 19px; fill: #b8c2cc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: rgba(255,255,255,0.07); stroke-width: 2.5; }
  </style>
  <rect class="card" x="20" y="40" width="290" height="200" rx="18" stroke="#b9a0ed"/>
  <text class="emoji" x="165" y="118" text-anchor="middle">📁</text>
  <text class="label" x="165" y="170" text-anchor="middle">repo</text>
  <text class="small mono" x="165" y="204" text-anchor="middle">main: your .qmd</text>

  <path d="M318,140 L392,140" stroke="#86cce8" stroke-width="3" marker-end="url(#ghp-arrow)"/>

  <rect class="card" x="405" y="40" width="290" height="200" rx="18" stroke="#e9b86e"/>
  <text class="emoji" x="550" y="118" text-anchor="middle">🌿</text>
  <text class="label mono" x="550" y="170" text-anchor="middle">gh-pages</text>
  <text class="small" x="550" y="204" text-anchor="middle">branch: rendered HTML</text>

  <path d="M703,140 L777,140" stroke="#86cce8" stroke-width="3" marker-end="url(#ghp-arrow)"/>

  <rect class="card" x="790" y="40" width="290" height="200" rx="18" stroke="#79d4b2"/>
  <text class="emoji" x="935" y="118" text-anchor="middle">🌍</text>
  <text class="label" x="935" y="170" text-anchor="middle">live site</text>
  <text class="small mono" x="935" y="204" text-anchor="middle">user.github.io/repo/</text>

  <text class="small mono" x="550" y="285" text-anchor="middle">quarto publish gh-pages  →  renders, pushes, serves</text>
</svg>

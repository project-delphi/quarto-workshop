<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">PowerShell open as administrator</title>
<desc id="d">A drawing of a dark blue PowerShell window. Its title bar reads Administrator: Windows PowerShell, circled. The last line is the prompt PS C:\WINDOWS\system32 followed by a greater-than sign.</desc>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.m{font-family:Consolas,Menlo,ui-monospace,monospace}
.hl{fill:none;stroke:#ffb000;stroke-width:5}
.tag{fill:#ffb000}
.tagt{font-size:20px;font-weight:700;fill:#1b1b1b}
</style>
<rect width="900" height="380" rx="12" fill="#1f3a5f"/>
<rect x="60" y="40" width="780" height="270" rx="8" fill="#012456" stroke="#5a6270"/>
<rect x="60" y="40" width="780" height="40" rx="8" fill="#2a2f37"/>
<rect x="60" y="64" width="780" height="16" fill="#2a2f37"/>
<text x="80" y="66" font-size="16" fill="#e8e8e8">Administrator: Windows PowerShell</text>
<text x="745" y="66" font-size="16" fill="#9aa3ad">─   ▢   ✕</text>
<rect x="70" y="46" width="290" height="32" rx="8" class="hl"/>
<text x="80" y="118" font-size="16" fill="#eeedf0" class="m">Windows PowerShell</text>
<text x="80" y="144" font-size="16" fill="#eeedf0" class="m">Copyright (C) Microsoft Corporation. All rights reserved.</text>
<text x="80" y="206" font-size="18" fill="#eeedf0" class="m">PS C:\WINDOWS\system32&gt;</text>
<rect x="348" y="190" width="11" height="20" fill="#eeedf0"/>
<rect x="76" y="186" width="290" height="32" rx="6" class="hl"/>
<rect x="400" y="236" width="400" height="36" rx="6" class="tag"/>
<text x="416" y="261" class="tagt">Title says Administrator ✓</text>
<rect x="400" y="326" width="440" height="36" rx="6" class="tag"/>
<text x="416" y="351" class="tagt">Last line ends in  &gt;  — ready to type</text>
</svg>

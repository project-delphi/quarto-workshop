<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
<title id="t">Right-click Windows PowerShell and choose Run as administrator</title>
<desc id="d">A drawing of the search result Windows PowerShell with a right-click menu open beside it. The menu lists Open, Run as administrator, Run ISE as administrator and Open file location. Run as administrator is highlighted and circled.</desc>
<style>
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.m{font-family:Consolas,Menlo,ui-monospace,monospace}
.hl{fill:none;stroke:#ffb000;stroke-width:5}
.tag{fill:#ffb000}
.tagt{font-size:20px;font-weight:700;fill:#1b1b1b}
</style>
<rect width="900" height="460" rx="12" fill="#1f3a5f"/>
<rect x="60" y="60" width="360" height="300" rx="10" fill="#2b2f36" stroke="#444a54"/>
<text x="80" y="100" font-size="14" fill="#9aa3ad">Best match</text>
<rect x="76" y="110" width="328" height="72" rx="8" fill="#3a4a63"/>
<rect x="88" y="124" width="44" height="44" rx="6" fill="#012456"/>
<text x="95" y="154" font-size="20" font-weight="700" fill="#fff" class="m">&gt;_</text>
<text x="144" y="143" font-size="18" fill="#fff">Windows PowerShell</text>
<text x="144" y="165" font-size="14" fill="#c4ccd6">App</text>
<!-- context menu -->
<rect x="330" y="150" width="290" height="190" rx="8" fill="#2f343b" stroke="#5a6270"/>
<text x="352" y="188" font-size="18" fill="#e8e8e8">Open</text>
<rect x="338" y="206" width="274" height="40" rx="6" fill="#0a64b5"/>
<text x="352" y="233" font-size="18" font-weight="700" fill="#fff">Run as administrator</text>
<text x="352" y="274" font-size="18" fill="#e8e8e8">Run ISE as administrator</text>
<text x="352" y="316" font-size="18" fill="#e8e8e8">Open file location</text>
<rect x="334" y="202" width="282" height="48" rx="10" class="hl"/>
<!-- labels -->
<rect x="480" y="60" width="380" height="36" rx="6" class="tag"/>
<text x="496" y="85" class="tagt">1  Right-click Windows PowerShell</text>
<rect x="636" y="206" width="250" height="36" rx="6" class="tag"/>
<text x="650" y="231" class="tagt">2  Run as administrator</text>
<path d="M636 224 H618" stroke="#ffb000" stroke-width="4"/>
<rect x="480" y="380" width="380" height="36" rx="6" class="tag"/>
<text x="496" y="405" class="tagt">3  Then choose Yes when asked</text>
</svg>

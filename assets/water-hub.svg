<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="whub-title whub-desc">
  <title id="whub-title">One water analysis, many publications</title>
  <desc id="whub-desc">Municipal water data flows into one analysis script that writes cluster outputs once. Every publication reads those outputs: a docx report, a pdf brief, pptx slides for the council, xlsx cluster tables, a blog post, a website and a dashboard. All of them are published together on GitHub Pages.</desc>
  <defs>
    <marker id="w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86cce8"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f0f0; }
    .label { font-size: 24px; font-weight: 600; }
    .small { font-size: 17px; fill: #b8c2cc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: rgba(255,255,255,0.07); stroke-width: 2.5; }
    .spoke { stroke: #86cce8; stroke-width: 2.2; fill: none; }
  </style>

  <!-- Data -->
  <rect class="card" x="10" y="215" width="190" height="110" rx="14" stroke="#b9a0ed"/>
  <text class="label" x="105" y="260" text-anchor="middle">💧 data/</text>
  <text class="small" x="105" y="292" text-anchor="middle">CSV + GeoJSON</text>
  <path class="spoke" d="M200,270 L238,270" marker-end="url(#w-arrow)"/>

  <!-- Compute once -->
  <rect x="245" y="185" width="250" height="170" rx="18" fill="rgba(134,204,232,0.14)" stroke="#86cce8" stroke-width="4"/>
  <text class="label" x="370" y="235" text-anchor="middle">🔁 compute once</text>
  <text class="small mono" x="370" y="272" text-anchor="middle">analysis.py</text>
  <text class="small mono" x="370" y="300" text-anchor="middle">→ outputs/</text>
  <text class="small mono" x="370" y="326" text-anchor="middle">clusters.parquet</text>

  <!-- Spokes -->
  <path class="spoke" d="M495,230 C540,110 560,52 590,50" marker-end="url(#w-arrow)"/>
  <path class="spoke" d="M495,245 C540,160 560,124 590,122" marker-end="url(#w-arrow)"/>
  <path class="spoke" d="M495,258 C540,210 560,196 590,194" marker-end="url(#w-arrow)"/>
  <path class="spoke" d="M495,270 L590,266" marker-end="url(#w-arrow)"/>
  <path class="spoke" d="M495,282 C540,325 560,336 590,338" marker-end="url(#w-arrow)"/>
  <path class="spoke" d="M495,295 C540,375 560,408 590,410" marker-end="url(#w-arrow)"/>
  <path class="spoke" d="M495,310 C540,425 560,480 590,482" marker-end="url(#w-arrow)"/>

  <!-- Publish many -->
  <g>
    <rect class="card" x="595" y="24" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="58">📄 docx report</text>
    <rect class="card" x="595" y="96" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="130">📕 pdf brief</text>
    <rect class="card" x="595" y="168" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="202">📊 pptx council</text>
    <rect class="card" x="595" y="240" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="274">📗 xlsx tables</text>
    <rect class="card" x="595" y="312" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="346">✍️ blog post</text>
    <rect class="card" x="595" y="384" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="418">🌐 website</text>
    <rect class="card" x="595" y="456" width="260" height="52" rx="26" stroke="#86cce8"/>
    <text class="label" x="618" y="490">📈 dashboard</text>
  </g>

  <!-- Merge into GitHub Pages -->
  <path class="spoke" d="M855,50 C905,52 920,220 958,262" />
  <path class="spoke" d="M855,482 C905,480 920,320 958,280" />
  <path class="spoke" d="M855,266 L950,270" marker-end="url(#w-arrow)"/>
  <rect class="card" x="958" y="205" width="132" height="130" rx="16" stroke="#79d4b2"/>
  <text x="1024" y="262" text-anchor="middle" style="font-size:44px">🌍</text>
  <text class="small" x="1024" y="300" text-anchor="middle">GitHub</text>
  <text class="small" x="1024" y="321" text-anchor="middle">Pages</text>
</svg>

# Python environment recipe for rendering the Quarto workshop teaching decks.
# Optional conda recipe; each example project manages its own dependencies via uv.
name: quarto-workshop
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - jupyter
  - ipykernel      # required: Quarto executes {python} cells through a kernel
  - nbformat       # required: Quarto reads/writes notebooks when rendering .qmd
  - nbclient       # required: Quarto's notebook execution client
  - matplotlib
  - pandas
  - numpy
  - plotly         # interactive charts in HTML pages and dashboards
  - scikit-learn   # k-means clustering in the water-quality analysis
  - pyarrow        # parquet outputs shared by the water project documents
  - itables        # searchable tables in dashboards
  - tabulate       # pandas .to_markdown() support
  - pillow         # image sizes for the e-book landing page (ebook/_parts.py)
  - pyyaml         # reads book/_chapters.yml for the landing page (ebook/_source.py)
  - pip

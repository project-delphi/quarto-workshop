project:
  type: website
  output-dir: docs
  # Explicitly exclude contributor instructions and exercise workspaces.
  render:
    - index.qmd
    - ai-workflows.qmd
  preview:
    browser: false

lang: en

# Keep live teaching examples reproducible and surface execution failures.
execute:
  echo: true
  warning: true
  error: false
  cache: false
  freeze: false

format:
  revealjs:
    theme: black
    css: slides.css
    embed-resources: true
    slide-level: 2
    slide-number: c/t
    transition: fade
    transition-speed: fast
    background-transition: fade
    width: 1280
    height: 800
    margin: 0.08
    center: false
    controls: true
    progress: true
    hash: true
    navigation-mode: linear
    code-copy: true
    code-overflow: wrap
    auto-stretch: false
    scroll-view:
      activation-width: 768
    footer: "Quarto Workshop"

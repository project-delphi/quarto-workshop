project:
  type: website
  # Code runs from this folder, so every page reads outputs/ and data/ the same way.
  execute-dir: project
  # Compute once: rebuild outputs/ before every render.
  pre-render: scripts/analysis.py
  # Render only the pages; README and data notes stay plain files.
  render:
    - index.qmd
    - explore.qmd
    - clusters.qmd
    - report.qmd
    - slides.qmd
    - posts/four-kinds-of-municipal-zone/index.qmd

website:
  title: "Water quality in Colombian municipalities"
  navbar:
    left:
      - text: "Explore"
        href: explore.qmd
      - text: "Clusters"
        href: clusters.qmd
      - text: "Report"
        href: report.qmd
      - text: "Slides"
        href: slides.qmd
      - text: "Downloads"
        menu:
          - text: "Report (Word)"
            href: report.docx
          - text: "Report (PDF)"
            href: report.pdf
          - text: "Report (ePub)"
            href: report.epub
          - text: "Council slides (PowerPoint)"
            href: slides.pptx

format:
  html:
    theme: cosmo

execute:
  # Fresh execution: every render re-runs every page, so pages always match the
  # outputs/ that pre-render just rebuilt. Caching with freeze: auto is optional
  # and needs _freeze/ cleared whenever data/ or scripts/analysis.py change.
  freeze: false

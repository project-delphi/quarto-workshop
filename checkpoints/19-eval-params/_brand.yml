# Acme Signals' brand (a fictional company): one file for the site, the slides and the PDFs.
# Quarto applies it to html, revealjs and typst. It does not reach docx or pptx: those get
# the same colours and font from templates/, made by scripts/make_reference_docs.py.
# tests/test_deck_contrast.py checks that every text colour has WCAG contrast of at least 4.5:1.
meta:
  name: Acme Signals
color:
  palette:
    paper: "#fbfaf7"   # background
    ink: "#1b2733"     # body text
    navy: "#0b3d63"    # headings, primary
    cobalt: "#0b5cad"  # links
    slate: "#4a5663"   # captions, footer and slide number
    stone: "#d9d6cf"   # hairlines and table borders (decoration, not text)
  background: paper
  foreground: ink
  primary: navy
  secondary: slate
  light: paper
  dark: ink
typography:
  # System fonts only: nothing is downloaded when a page or the deck opens.
  fonts:
    - family: Helvetica
      source: system
    - family: Arial
      source: system
  base:
    family: Helvetica, Arial
  headings:
    family: Helvetica, Arial
    weight: 700
    color: navy
  link:
    color: cobalt
logo:
  images:
    wordmark:
      path: brand/logo.svg
      alt: "Acme Signals logo: a navy tile with three rising bars, and the name"
  small: wordmark
  medium: wordmark

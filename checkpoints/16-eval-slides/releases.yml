# Releases of the contact-ranking model of Acme Signals, a fictional company.
# The data are real (UCI Bank Marketing); the company, its releases and their dates are not.
#
# model:    logistic_regression (one-hot + scaling) or gradient_boosting
#           (scikit-learn's HistGradientBoostingClassifier)
# features: a list of columns, or "all" for every column in acme_eval.data.FEATURES
#           (all 16 inputs except `duration`)
releases:
  - version: v1
    month: "2026-03"
    model: logistic_regression
    features: [age, balance, housing, loan]
    description: Logistic regression on four customer fields.
  - version: v2
    month: "2026-06"
    model: logistic_regression
    features: all
    description: Logistic regression on every field known before the call.
  - version: v3
    month: "2026-09"
    model: gradient_boosting
    features: all
    description: Gradient-boosted trees on every field known before the call.

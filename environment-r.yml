# Optional R environment for the Quarto workshop's RStudio section.
# Not needed for the blog path — create it only if you are doing that section.
#   conda env create -f environment-r.yml -p "$PWD/.conda-r"
#   conda activate "$PWD/.conda-r"
name: quarto-workshop-r
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.3.3
  - r-essentials
  - r-rmarkdown
  - r-knitr

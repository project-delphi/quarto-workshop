# Optional R environment recipe for the Quarto workshop.
# Create only if you are executing R cells with knitr:
#   conda env create -f environment-r.yml -p "$PWD/.conda-r"
#   conda activate "$PWD/.conda-r"
name: quarto-workshop-r
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.3.3
  - r-essentials
  - r-rmarkdown
  - r-knitr

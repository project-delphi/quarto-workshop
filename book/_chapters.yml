# The book's one chapter list. scripts/sync_chapters.py writes it into the two profiles:
# _quarto-html.yml groups chapters under `part:` pages, and _quarto-epub.yml lists the part
# pages as ordinary unnumbered chapters, because Quarto 1.10.20 drops `part:` entries from
# EPUB (book/PLAN.md, finding S1). Edit this file, never the generated profiles.
front:
  - index.qmd
  - copyright.qmd
  - dedication.qmd
  - about-author.qmd
parts:
  - file: part-1.qmd
    chapters:
      - chapters/01-quarto.qmd
      - chapters/02-assistant.qmd
      - chapters/03-setup.qmd
  - file: part-2.qmd
    chapters:
      - chapters/04-markdown.qmd
      - chapters/05-compute.qmd
      - chapters/06-audiences.qmd
      - chapters/07-publish.qmd
      - chapters/exercises-london.qmd
  - file: part-3.qmd
    chapters:
      - chapters/08-water-question.qmd
      - chapters/09-explore.qmd
      - chapters/10-prepare.qmd
      - chapters/11-cluster.qmd
      - chapters/12-interpret.qmd
      - chapters/13-causation.qmd
      - chapters/14-publish-many.qmd
      - chapters/exercises-water.qmd
back:
  - afterword.qmd
appendices:
  - appendices/a-windows.qmd
  - appendices/b-terminal.qmd
  - appendices/c-cheatsheet.qmd
  - appendices/d-troubleshooting.qmd
  - appendices/e-checkpoints.qmd
  - appendices/f-translation.qmd
  - appendices/g-sources.qmd
  - appendices/h-how-built.qmd
  - appendices/i-workshop.qmd

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" role="img" aria-labelledby="t d">
<title id="t">How a coding assistant works</title>
<desc id="d">You give the harness a prompt, and it shows you results and asks you to approve commands. The harness (Claude Code, Codex or Antigravity) sends the conversation and tool results to the model (Claude, GPT or Gemini), which runs on the vendor's servers and replies with text or a request to use a tool. The harness carries out tool requests in the project folder, its root: it reads AGENTS.md first, then reads and edits files and runs commands there. The model decides, the harness does, and you direct and check.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 26px; font-weight: 700; }
  .s { font-size: 21px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
</style>
<!-- you -->
<rect x="190" y="14" width="320" height="96" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="350" y="55" text-anchor="middle" class="h">You</text>
<text x="350" y="88" text-anchor="middle" class="s">direct and check</text>
<path class="arrow" d="M260,110 L260,176"/>
<text x="250" y="150" text-anchor="end" class="n">prompt</text>
<path class="arrow" d="M440,176 L440,110"/>
<text x="452" y="140" class="n">results,</text>
<text x="452" y="162" class="n">"approve this?"</text>
<!-- harness -->
<rect x="30" y="180" width="410" height="250" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="56" y="220" class="h">Harness</text>
<text x="56" y="250" class="n">Claude Code · Codex · Antigravity</text>
<text x="56" y="292" class="s">reads and writes files</text>
<text x="56" y="324" class="s">runs commands</text>
<text x="56" y="356" class="s">searches</text>
<text x="56" y="388" class="s">asks before acting</text>
<!-- model -->
<rect x="500" y="200" width="180" height="210" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="590" y="240" text-anchor="middle" class="h">Model</text>
<text x="590" y="274" text-anchor="middle" class="s">Claude, GPT</text>
<text x="590" y="300" text-anchor="middle" class="s">or Gemini</text>
<text x="590" y="340" text-anchor="middle" class="n">on the vendor's</text>
<text x="590" y="364" text-anchor="middle" class="n">servers</text>
<path class="arrow" d="M440,262 L496,262"/>
<path class="arrow" d="M500,352 L444,352"/>
<!-- loop labels -->
<!-- folder -->
<path class="arrow" d="M150,430 L150,546"/>
<text x="162" y="528" class="n">edits, runs</text>
<path class="arrow" d="M350,546 L350,430"/>
<text x="362" y="528" class="n">reads AGENTS.md first</text>
<rect x="30" y="550" width="640" height="170" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="56" y="590" class="h">Project folder, the root</text>
<text x="56" y="630" class="m s">AGENTS.md</text><text x="260" y="630" class="m s">london.qmd</text>
<text x="56" y="662" class="m s">data/</text><text x="260" y="662" class="m s">images/</text>
<text x="56" y="698" class="n">the assistant's world: start it here</text>
<text x="350" y="772" text-anchor="middle" class="s">The model decides · the harness does · you check</text>
</svg>

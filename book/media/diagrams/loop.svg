<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 740" role="img" aria-labelledby="t d">
<title id="t">Prompt, Check, Publish</title>
<desc id="d">The loop this book teaches, run at every step of both projects. Prompt: you ask a coding assistant for one small step, naming the files and columns and ending with a check; Chapter 2. The assistant does the work: it writes files and runs commands. Check: you read what changed, open the result and compare it with the data; this step is always yours. If it is not right, you fix the prompt, or catch up from a checkpoint, and prompt again. The checked source goes to Publish: Quarto rebuilds every output from it with quarto render, the same way every time; Chapter 1. Then the next step begins with a new prompt.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2416b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 27px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .tag { font-size: 19px; font-weight: 600; letter-spacing: 1px; fill: #5b6b7b; }
  .rl { font-size: 19px; font-weight: 600; fill: #c2416b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .back { stroke: #c2416b; stroke-width: 2.5; fill: none; marker-end: url(#r); stroke-dasharray: 8 6; }
</style>
<!-- the return to the next step (right) and the fix branch (left), drawn first so the nodes sit on top -->
<path class="arrow" d="M530,535 C665,535 665,95 534,95"/>
<rect x="580" y="296" width="110" height="38" rx="19" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.5"/>
<text x="635" y="322" text-anchor="middle" class="n">next step</text>
<path class="back" d="M190,315 C40,315 40,95 186,95"/>
<rect x="14" y="186" width="150" height="62" rx="14" fill="#ffffff" stroke="#c2416b" stroke-width="1.5"/>
<text x="89" y="211" text-anchor="middle" class="rl">not right?</text>
<text x="89" y="236" text-anchor="middle" class="n">fix the prompt</text>
<!-- Prompt -->
<rect x="190" y="20" width="340" height="150" rx="14" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="210" y="50" class="tag">YOU → ASSISTANT</text>
<text x="510" y="50" text-anchor="end" class="n">Ch. 2</text>
<text x="360" y="92" text-anchor="middle" class="h">Prompt</text>
<text x="360" y="124" text-anchor="middle" class="s">one small step, files named,</text>
<text x="360" y="151" text-anchor="middle" class="s">ending with a check</text>
<path class="arrow" d="M360,170 L360,236"/>
<text x="374" y="210" class="n">the assistant works</text>
<!-- Check -->
<rect x="190" y="240" width="340" height="150" rx="14" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="210" y="270" class="tag">YOU</text>
<text x="510" y="270" text-anchor="end" class="n">Ch. 2</text>
<text x="360" y="312" text-anchor="middle" class="h">Check</text>
<text x="360" y="344" text-anchor="middle" class="s">read what changed, open the</text>
<text x="360" y="371" text-anchor="middle" class="s">result, compare with the data</text>
<path class="arrow" d="M360,390 L360,456"/>
<text x="374" y="430" class="n">the checked source</text>
<!-- Publish -->
<rect x="190" y="460" width="340" height="150" rx="14" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="210" y="490" class="tag">QUARTO</text>
<text x="510" y="490" text-anchor="end" class="n">Ch. 1</text>
<text x="360" y="532" text-anchor="middle" class="h">Publish</text>
<text x="360" y="564" text-anchor="middle" class="s"><tspan class="m">quarto render</tspan> rebuilds every</text>
<text x="360" y="591" text-anchor="middle" class="s">output, the same way every time</text>
<!-- footer -->
<text x="360" y="672" text-anchor="middle" class="s">Small steps, each one checked,</text>
<text x="360" y="702" text-anchor="middle" class="s">every output rebuilt from one source.</text>
</svg>

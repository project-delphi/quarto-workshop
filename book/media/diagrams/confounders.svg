<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img" aria-labelledby="t d">
<title id="t">What else could explain it</title>
<desc id="d">The question is whether unsafe water raises infant mortality, a direct arrow from water safety to infant deaths, marked with a question mark. Other paths connect the two. Poverty and rurality make water less safe and also make infant deaths more likely, so they can create an association without any effect of water: a confounder. Health-service access, worse in poor rural places, affects infant deaths. Reporting quality stands between real and recorded deaths: places with weak registration record fewer deaths, which can hide a real effect. And the data meet at different levels: IRCA is measured for a zone, infant mortality for the whole municipality, so a pattern across places need not hold for the people in them.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2416b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 23px; font-weight: 700; }
  .s { font-size: 19px; fill: #3d4b59; }
  .n { font-size: 18px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .q { stroke: #c2416b; stroke-width: 3; fill: none; marker-end: url(#q); stroke-dasharray: 8 6; }
</style>
<rect x="190" y="14" width="320" height="86" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2.5"/>
<text x="350" y="50" text-anchor="middle" class="h">Poverty, rurality</text>
<text x="350" y="80" text-anchor="middle" class="n">a confounder: touches both</text>
<path class="arrow" d="M240,100 C200,150 150,170 140,236"/>
<path class="arrow" d="M460,100 C500,150 550,170 560,236"/>
<path class="arrow" d="M350,100 L350,236"/>

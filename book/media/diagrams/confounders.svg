<text x="350" y="276" text-anchor="middle" class="h">Health-service</text>
<text x="350" y="304" text-anchor="middle" class="h">access</text>
<rect x="20" y="240" width="210" height="110" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="125" y="280" text-anchor="middle" class="h">Water safety</text>
<text x="125" y="310" text-anchor="middle" class="s">IRCA, per zone</text>
<rect x="470" y="240" width="210" height="110" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="575" y="280" text-anchor="middle" class="h">Infant deaths</text>
<text x="575" y="310" text-anchor="middle" class="s">real, per municipality</text>
<path class="arrow" d="M450,300 L466,300"/>
<path class="q" d="M125,350 C125,430 520,430 520,354"/>
<text x="330" y="440" text-anchor="middle" class="h">the question: water → deaths?</text>
<path class="arrow" d="M630,350 L630,500"/>
<rect x="430" y="504" width="250" height="110" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2" stroke-dasharray="7 5"/>
<text x="555" y="544" text-anchor="middle" class="h">Recorded deaths</text>
<text x="555" y="574" text-anchor="middle" class="s">what the data hold</text>
<rect x="20" y="504" width="330" height="110" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
<text x="185" y="544" text-anchor="middle" class="h">Reporting quality</text>
<text x="185" y="574" text-anchor="middle" class="s">weak registration hides deaths</text>
<path class="arrow" d="M350,559 L426,559"/>
<rect x="20" y="650" width="660" height="96" rx="12" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="350" y="690" text-anchor="middle" class="s">Ecological level: IRCA per zone, deaths per municipality.</text>
<text x="350" y="720" text-anchor="middle" class="n">A pattern across places need not hold for the people in them.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img" aria-labelledby="t d">
<title id="t">Catching up from a checkpoint</title>
<desc id="d">Stuck for two minutes, you paste the line Catch me up: follow ../quarto-workshop/checkpoints/NN/README.md into the assistant. It follows four steps. One, back up your project folder, all but its .venv environment, to a new time-stamped folder beside it. Two, copy the checkpoint in, and for the water project the data if they are missing. Three, render and check a named output. Four, rejoin at the next hands-on block, which the README names.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 25px; font-weight: 700; }
  .s { font-size: 21px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .num { font-size: 24px; font-weight: 700; fill: #ffffff; }
</style>
<text x="350" y="40" text-anchor="middle" class="h">Stuck for two minutes?</text>
<rect x="30" y="62" width="640" height="136" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="54" y="98" class="n">paste into your assistant:</text>
<text x="54" y="136" class="m" font-size="19">Catch me up: follow ../quarto-workshop/</text>
<text x="54" y="170" class="m" font-size="19">  checkpoints/NN-…/README.md</text>
<path class="arrow" d="M350,198 L350,232"/>
<!-- steps -->
<g>
  <rect x="30" y="236" width="640" height="104" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2"/>
  <circle cx="74" cy="288" r="24" fill="#b07a14"/><text x="74" y="296" text-anchor="middle" class="num">1</text>
  <text x="116" y="278" class="h">Back up your folder</text>
  <text x="116" y="312" class="s">all but <tspan class="m">.venv/</tspan>, to a new time-stamped copy</text>
</g>
<path class="arrow" d="M350,340 L350,366"/>
<g>
  <rect x="30" y="370" width="640" height="104" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2"/>
  <circle cx="74" cy="422" r="24" fill="#2f72b0"/><text x="74" y="430" text-anchor="middle" class="num">2</text>
  <text x="116" y="412" class="h">Copy the checkpoint in</text>
  <text x="116" y="446" class="s">water projects: copy <tspan class="m">data/</tspan> if missing</text>
</g>
<path class="arrow" d="M350,474 L350,500"/>
<g>
  <rect x="30" y="504" width="640" height="104" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2"/>
  <circle cx="74" cy="556" r="24" fill="#2f9e77"/><text x="74" y="564" text-anchor="middle" class="num">3</text>
  <text x="116" y="546" class="h">Render and check</text>
  <text x="116" y="580" class="s">the README names the output to open</text>
</g>
<path class="arrow" d="M350,608 L350,634"/>
<g>
  <rect x="30" y="638" width="640" height="104" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
  <circle cx="74" cy="690" r="24" fill="#7c5cdb"/><text x="74" y="698" text-anchor="middle" class="num">4</text>
  <text x="116" y="680" class="h">Rejoin at the next block</text>
  <text x="116" y="714" class="s">skip the rest of this block's prompts</text>
</g>
</svg>

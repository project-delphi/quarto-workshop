<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 990" role="img" aria-labelledby="t d">
<title id="t">Why reports drift</title>
<desc id="d">Two ways to publish the London guide's attraction counts after ALVA corrects one figure in attractions.csv. By hand: each number is copied into each output, one at a time, so the web guide and the dashboard get the new number while the Word brief, the social card and the white paper still show the old one. One source: code cells in the project's .qmd pages read attractions.csv, and one quarto render rebuilds the web guide, the dashboard, the Word brief, the social card and the white paper, all with the corrected number.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 27px; font-weight: 700; }
  .b { font-size: 23px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .p { font-size: 20px; text-anchor: middle; }
  .ok { fill: #1f7a5a; font-weight: 700; }
  .old { fill: #b85a16; font-weight: 700; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .good { fill: #e3f4ed; stroke: #2f9e77; stroke-width: 2; }
  .stale { fill: #fdeee2; stroke: #d0752b; stroke-width: 2; stroke-dasharray: 7 5; }
  .data { fill: #fbf1de; stroke: #b07a14; stroke-width: 2.5; }
</style>
<!-- By hand -->
<text x="20" y="40" class="h">By hand</text>
<text x="20" y="70" class="n">each number is copied into each output</text>
<rect class="data" x="200" y="92" width="300" height="80" rx="12"/>
<text x="350" y="126" text-anchor="middle" class="m s">attractions.csv</text>
<text x="350" y="157" text-anchor="middle" class="n">ALVA corrects a figure</text>
<path class="arrow" d="M350,172 L350,236"/>
<text x="364" y="212" class="n">retyped by hand, one at a time</text>
<rect class="good" x="20" y="240" width="206" height="54" rx="27"/>
<text x="123" y="274" class="p"><tspan class="ok">✓</tspan> web guide</text>
<rect class="good" x="247" y="240" width="206" height="54" rx="27"/>
<text x="350" y="274" class="p"><tspan class="ok">✓</tspan> dashboard</text>
<rect class="stale" x="474" y="240" width="206" height="54" rx="27"/>
<text x="577" y="274" class="p"><tspan class="old">✗</tspan> Word brief</text>
<rect class="stale" x="133" y="310" width="206" height="54" rx="27"/>
<text x="236" y="344" class="p"><tspan class="old">✗</tspan> social card</text>
<rect class="stale" x="360" y="310" width="206" height="54" rx="27"/>
<text x="463" y="344" class="p"><tspan class="old">✗</tspan> white paper</text>
<text x="350" y="400" text-anchor="middle" class="n"><tspan class="ok">✓</tspan> new number   <tspan class="old">✗</tspan> still the old one</text>
<line x1="20" y1="436" x2="680" y2="436" stroke="#c3ccd5" stroke-width="2"/>
<!-- One source -->
<text x="20" y="484" class="h">One source</text>
<text x="20" y="514" class="n">every number is computed from the data</text>
<rect class="data" x="200" y="536" width="300" height="80" rx="12"/>
<text x="350" y="570" text-anchor="middle" class="m s">attractions.csv</text>
<text x="350" y="601" text-anchor="middle" class="n">ALVA corrects a figure</text>
<path class="arrow" d="M350,616 L350,664"/>
<text x="364" y="646" class="n">read by code cells</text>
<rect x="170" y="668" width="360" height="80" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="350" y="702" text-anchor="middle" class="b">The project's pages</text>
<text x="350" y="733" text-anchor="middle" class="n"><tspan class="m">.qmd</tspan> sources you edit and check</text>
<path class="arrow" d="M350,748 L350,812"/>
<text x="364" y="788" class="m n">quarto render</text>
<rect class="good" x="20" y="816" width="206" height="54" rx="27"/>
<text x="123" y="850" class="p"><tspan class="ok">✓</tspan> web guide</text>
<rect class="good" x="247" y="816" width="206" height="54" rx="27"/>
<text x="350" y="850" class="p"><tspan class="ok">✓</tspan> dashboard</text>
<rect class="good" x="474" y="816" width="206" height="54" rx="27"/>
<text x="577" y="850" class="p"><tspan class="ok">✓</tspan> Word brief</text>
<rect class="good" x="133" y="886" width="206" height="54" rx="27"/>
<text x="236" y="920" class="p"><tspan class="ok">✓</tspan> social card</text>
<rect class="good" x="360" y="886" width="206" height="54" rx="27"/>
<text x="463" y="920" class="p"><tspan class="ok">✓</tspan> white paper</text>
<text x="350" y="976" text-anchor="middle" class="n">every output updated by one command</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 780" role="img" aria-labelledby="t d">
<title id="t">Every change, safely: the Git loop</title>
<desc id="d">Six steps. Branch: work on a branch, so main stays untouched. Commit: save a snapshot of the files with a message saying why. Push: copy the commits to GitHub. Pull request: propose the change and show the difference. Review: someone reads the difference and comments, approves or asks for changes. Merge: the commits join main. Working alone, you commit to main and push; in a team, every change goes round the whole loop.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 24px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 18px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
</style>
<g id="steps">
  <rect x="40" y="20" width="420" height="80" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
  <circle cx="80" cy="60" r="20" fill="#7c5cdb"/><text x="80" y="67" text-anchor="middle" class="num">1</text>
  <text x="114" y="54" class="h">Branch</text><text x="114" y="84" class="s">main stays untouched</text>
  <path class="arrow" d="M250,100 L250,126"/>
  <rect x="40" y="130" width="420" height="80" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2"/>
  <circle cx="80" cy="170" r="20" fill="#2f72b0"/><text x="80" y="177" text-anchor="middle" class="num">2</text>
  <text x="114" y="164" class="h">Commit</text><text x="114" y="194" class="s">a snapshot, with why</text>
  <path class="arrow" d="M250,210 L250,236"/>
  <rect x="40" y="240" width="420" height="80" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2"/>
  <circle cx="80" cy="280" r="20" fill="#2f72b0"/><text x="80" y="287" text-anchor="middle" class="num">3</text>
  <text x="114" y="274" class="h">Push</text><text x="114" y="304" class="s">copy the commits to GitHub</text>
  <path class="arrow" d="M250,320 L250,346"/>
  <rect x="40" y="350" width="420" height="80" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2"/>
  <circle cx="80" cy="390" r="20" fill="#b07a14"/><text x="80" y="397" text-anchor="middle" class="num">4</text>
  <text x="114" y="384" class="h">Pull request</text><text x="114" y="414" class="s">propose it; show the diff</text>
  <path class="arrow" d="M250,430 L250,456"/>
  <rect x="40" y="460" width="420" height="80" rx="12" fill="#fbf1de" stroke="#b07a14" stroke-width="2"/>
  <circle cx="80" cy="500" r="20" fill="#b07a14"/><text x="80" y="507" text-anchor="middle" class="num">5</text>
  <text x="114" y="494" class="h">Review</text><text x="114" y="524" class="s">someone reads the diff</text>
  <path class="arrow" d="M250,540 L250,566"/>
  <rect x="40" y="570" width="420" height="80" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2"/>
  <circle cx="80" cy="610" r="20" fill="#2f9e77"/><text x="80" y="617" text-anchor="middle" class="num">6</text>
  <text x="114" y="604" class="h">Merge</text><text x="114" y="634" class="s">the change joins main</text>
</g>
<!-- team loop back -->
<path class="arrow" d="M460,610 C700,610 700,60 464,60"/>
<text x="478" y="300" class="n">a team:</text>
<text x="478" y="324" class="n">every change</text>
<text x="478" y="348" class="n">goes round</text>
<!-- alone -->
<rect x="40" y="680" width="620" height="80" rx="12" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="350" y="714" text-anchor="middle" class="s">Alone, as in this book: commit to main and push.</text>
<text x="350" y="742" text-anchor="middle" class="n">The assistant runs Git; you read its diffs and approve.</text>
</svg>

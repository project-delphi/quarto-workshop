<desc id="d">Where we are: Part I: Start Here, highlighted among the book's four parts. Its chapters in order: 1, Publishing That Rebuilds Itself, read: why one source beats copies; 2, Working With a Coding Agent, read: how to ask for work and check it; 3, The Fast Path, build: a report in three formats, reviewed as a pull request, ends at checkpoint 14; 4, Setting Up Your Machine, build: a computer that renders the test run; 5, A First Report, by Hand, build: a report you checked, fixed and committed.</desc>

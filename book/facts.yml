data:
  title: "What the vendors do with your data"
  title_es: "Qué hacen los proveedores con tus datos"
  items:
    anthropic_consumer:
      label: "Claude's consumer plans"
      label_es: "Los planes de consumo de Claude"
      text: "on Anthropic's Free, Pro, Max and Ultra plans, Claude Code included, conversations are used to train new models when the user's privacy setting allows it, and are kept for five years when it does, thirty days when it does not"
      text_es: "en los planes Free, Pro, Max y Ultra de Anthropic, Claude Code incluido, las conversaciones se usan para entrenar nuevos modelos cuando tu configuración de privacidad lo permite, y se guardan cinco años si lo permite y treinta días si no"
      url: https://code.claude.com/docs/en/data-usage
      trains: "if your privacy setting allows it"
      trains_es: "si tu configuración de privacidad lo permite"
      kept: "five years if it does, thirty days if not"
      kept_es: "cinco años si lo permite, treinta días si no"
      checked: 2026-11-24
    anthropic_commercial:
      label: "Claude's commercial plans and the API"
      label_es: "Los planes comerciales de Claude y la API"
      text: "under Anthropic's commercial terms (Team, Enterprise, the API), code and prompts are not used for training unless the customer opts in, and are kept thirty days by default; zero data retention is available to qualified Enterprise accounts"
      text_es: "con las condiciones comerciales de Anthropic (Team, Enterprise, la API), el código y los prompts no se usan para entrenar salvo que el cliente lo acepte, y se guardan treinta días de forma predeterminada; la retención cero de datos está disponible para las cuentas Enterprise que cumplen los requisitos"
      url: https://code.claude.com/docs/en/data-usage
      also: [https://code.claude.com/docs/en/zero-data-retention]
      trains: "not unless the customer opts in"
      trains_es: "no, salvo que el cliente lo acepte"
      kept: "thirty days by default"
      kept_es: "treinta días de forma predeterminada"
      checked: 2026-11-24
    claude_local:
      label: "What Claude Code keeps on your computer"
      label_es: "Lo que Claude Code guarda en tu computadora"
      text: "Claude Code keeps session transcripts in plain text under ~/.claude/projects/ for thirty days by default"
      text_es: "Claude Code guarda las transcripciones de las sesiones en texto plano en ~/.claude/projects/ durante treinta días de forma predeterminada"
      url: https://code.claude.com/docs/en/data-usage
      checked: 2026-11-18
    openai_api:
      label: "OpenAI's API"
      label_es: "La API de OpenAI"
      text: "data sent to OpenAI's API is not used for training unless you opt in; abuse-monitoring logs are kept up to thirty days, and zero data retention needs OpenAI's approval"
      text_es: "los datos enviados a la API de OpenAI no se usan para entrenar salvo que lo aceptes; los registros de control de abusos se guardan hasta treinta días, y la retención cero de datos necesita la aprobación de OpenAI"
      url: https://developers.openai.com/api/docs/guides/your-data
      trains: "not unless you opt in"
      trains_es: "no, salvo que lo aceptes"
      kept: "abuse-monitoring logs, up to thirty days"
      kept_es: "registros de control de abusos, hasta treinta días"
      checked: 2026-11-24
    openai_business:
      label: "ChatGPT's business plans"
      label_es: "Los planes empresariales de ChatGPT"
      text: "ChatGPT Business, Enterprise and Edu workspace data is not used to train OpenAI's models by default"
      text_es: "los datos de los espacios de trabajo de ChatGPT Business, Enterprise y Edu no se usan para entrenar los modelos de OpenAI de forma predeterminada"
      url: https://learn.chatgpt.com/docs/enterprise/chatgpt-work-cloud-security
      trains: "not by default"
      trains_es: "no, de forma predeterminada"
      kept: "as long as the workspace's admins set; deleted chats go within thirty days"
      kept_es: "lo que fijen los administradores del espacio de trabajo; los chats borrados se eliminan en treinta días"
      also: [https://openai.com/enterprise-privacy/, https://help.openai.com/en/articles/8983778]
      checked: 2026-11-24
    codex_signin:
      label: "Which policy Codex follows"
      label_es: "Qué política sigue Codex"
      text: "how you sign in to Codex, with a ChatGPT plan or an API key, decides which data policy applies"
      text_es: "la forma en que inicias sesión en Codex, con un plan de ChatGPT o con una clave de API, decide qué política de datos se aplica"
      url: https://learn.chatgpt.com/docs/auth
      checked: 2026-11-18
    antigravity_terms:
      label: "Antigravity's terms"
      label_es: "Las condiciones de Antigravity"
      text: "Antigravity's terms say Google uses interactions to improve its products, its employees and contractors may review them, and users can opt out in settings; they ask users not to submit confidential information"
      text_es: "las condiciones de Antigravity dicen que Google usa las interacciones para mejorar sus productos, que sus empleados y contratistas pueden revisarlas y que se puede desactivar en la configuración; piden no enviar información confidencial"
      url: https://antigravity.google/terms
      trains: "used to improve Google's products and machine learning, unless you opt out"
      trains_es: "se usan para mejorar los productos y el aprendizaje automático de Google, salvo que lo desactives"
      kept: "until you ask for deletion; no period is stated"
      kept_es: "hasta que pidas borrarlas; no se indica un plazo"
      checked: 2026-11-24
    opencode_free_terms:
      label: "What OpenCode's free models keep"
      label_es: "Qué guardan los modelos gratuitos de OpenCode"
      text: "with a provider you connect, that provider's terms apply; of OpenCode's free models, some keep prompts and may use them to improve the model, and NVIDIA's trial endpoints ask users not to submit personal or confidential data"
      text_es: "con un proveedor que conectes, se aplican sus condiciones; de los modelos gratuitos de OpenCode, algunos guardan los prompts y pueden usarlos para mejorar el modelo, y los puntos de acceso de prueba de NVIDIA piden no enviar datos personales ni confidenciales"
      url: https://opencode.ai/docs/zen/
      checked: 2026-11-20

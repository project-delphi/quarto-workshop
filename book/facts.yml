      label_es: "Un tope de gasto para Claude Code con facturación por API"
      text: "a Claude Console account can cap Claude Code's monthly spending with a workspace spend limit"
      text_es: "una cuenta de Claude Console puede limitar el gasto mensual de Claude Code con un límite de gasto del espacio de trabajo"
      url: https://code.claude.com/docs/en/costs
      also: [https://platform.claude.com/docs/en/manage-claude/workspaces]
      checked: 2026-11-18
    openai_spend_limit:
      label: "A spending cap for Codex on API billing"
      label_es: "Un tope de gasto para Codex con facturación por API"
      text: "an OpenAI API organization or project can set a hard monthly spend limit, after which requests stop"
      text_es: "una organización o un proyecto de la API de OpenAI puede fijar un límite estricto de gasto mensual, después del cual las solicitudes se detienen"
      url: https://developers.openai.com/api/docs/guides/spend-limits
      checked: 2026-11-18

github:
  title: "GitHub's free allowances"
  title_es: "Lo que GitHub da gratis"
  items:
    codespaces_free:
      label: "GitHub Codespaces on a free personal account"
      label_es: "GitHub Codespaces en una cuenta personal gratuita"
      text: "a free personal GitHub account includes 120 hours of Codespaces compute a month, counted twice over on the default two-core machine, so about 60 hours of use, and 15 GB of storage"
      text_es: "una cuenta personal gratuita de GitHub incluye 120 horas de cómputo de Codespaces al mes, que en la máquina predeterminada de dos núcleos cuentan doble, o sea unas 60 horas de uso, y 15 GB de almacenamiento"
      url: https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-codespaces/about-billing-for-github-codespaces
      checked: 2026-11-18

    pages_private:
      label: "GitHub Pages for private repositories"
      label_es: "GitHub Pages para repositorios privados"
      text: "a free GitHub account publishes Pages from public repositories only; private repositories need a paid plan, and a site only your organisation can see needs GitHub Enterprise Cloud"
      text_es: "una cuenta gratuita de GitHub publica Pages solo desde repositorios públicos; los repositorios privados necesitan un plan de pago, y un sitio que solo tu organización pueda ver necesita GitHub Enterprise Cloud"
      url: https://docs.github.com/en/get-started/learning-about-github/githubs-plans
      checked: 2026-11-18
    actions_free:
      label: "GitHub Actions on a free account"
      label_es: "GitHub Actions en una cuenta gratuita"
      text: "GitHub Actions' standard runners are free in public repositories, and a free account's private repositories get 12 US dollars of compute a month"
      text_es: "los runners estándar de GitHub Actions son gratuitos en los repositorios públicos, y los repositorios privados de una cuenta gratuita reciben 12 dólares estadounidenses de cómputo al mes"
      url: https://docs.github.com/en/billing/concepts/product-billing/github-actions
      checked: 2026-11-18
    protect_free:
      label: "Protected branches on a free account"
      label_es: "Ramas protegidas en una cuenta gratuita"
      text: "on a free GitHub account, protected branches and rulesets work in public repositories only; private repositories need GitHub Pro, Team or Enterprise"
      text_es: "en una cuenta gratuita de GitHub, las ramas protegidas y los rulesets funcionan solo en repositorios públicos; los privados necesitan GitHub Pro, Team o Enterprise"
      url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
      checked: 2026-11-18


models:
  title: "Models and their prices"
  title_es: "Los modelos y sus precios"
  items:
    everyday_models:
      label: "Models enough for this book's prompts"
      label_es: "Modelos suficientes para los prompts de este libro"
      text: "Claude's Sonnet on medium effort, or Haiku for small edits, or OpenAI's Sol on low"
      text_es: "Sonnet de Claude con esfuerzo medio, o Haiku para ediciones pequeñas, o Sol de OpenAI con esfuerzo bajo"
      url: https://platform.claude.com/docs/en/about-claude/models/overview
      also: [https://developers.openai.com/api/docs/models]
      checked: 2026-11-12
    vendor_starting_points:
      label: "Where the vendors suggest starting for hard work"
      label_es: "Dónde sugieren empezar los proveedores para el trabajo difícil"
      text: "Anthropic suggests starting with Opus 5.5 for most workloads, and OpenAI with GPT-6 Astra for complex reasoning and coding"
      text_es: "Anthropic sugiere empezar con Opus 5.5 para la mayoría de las cargas de trabajo, y OpenAI con GPT-6 Astra para el razonamiento y la programación complejos"
      url: https://platform.claude.com/docs/en/about-claude/models/overview
      also: [https://developers.openai.com/api/docs/models]
      checked: 2026-11-12
  prices:
    caption: "List prices of eight models, in dollars per million tokens of input and output"
    caption_es: "Precios de lista de ocho modelos, en dólares por millón de tokens de entrada y de salida"
    url: https://platform.claude.com/docs/en/about-claude/pricing
    also: [https://platform.claude.com/docs/en/about-claude/models/overview, https://developers.openai.com/api/docs/models]
    checked: 2026-11-12
    note: >-
      Haiku's price is for prompts up to 100,000 tokens; longer ones cost five times as much.
      Subscriptions count usage differently from API prices, and which models you can choose
      depends on your plan and the agent's version.
    note_es: >-
      El precio de Haiku es para prompts de hasta 100,000 tokens; los más largos cuestan cinco
      veces más. Las suscripciones cuentan el uso de otra manera que los precios de la API, y los
      modelos que puedes elegir dependen de tu plan y de la versión del agente.
    rows:
      - {model: "Claude Haiku 5.5", vendor: Anthropic, for: "high-volume, latency-sensitive tasks such as classification, extraction, and routing", input: 0.10, output: 0.50, for_es: "tareas de gran volumen y sensibles a la latencia, como clasificación, extracción y enrutamiento"}
      - {model: "Claude Sonnet 5.5", vendor: Anthropic, for: "the best combination of speed and intelligence", input: 2, output: 10, for_es: "la mejor combinación de velocidad e inteligencia"}
      - {model: "Claude Opus 5.5", vendor: Anthropic, for: "long-running agentic coding and knowledge work", input: 4, output: 20, for_es: "programación agéntica de larga duración y trabajo de conocimiento"}
      - {model: "Claude Fable 5.2", vendor: Anthropic, for: "demanding reasoning and long-horizon agentic work", input: 8, output: 40, for_es: "razonamiento exigente y trabajo agéntico de largo horizonte"}
      - {model: "GPT-6 Luna", vendor: OpenAI, for: "focused, high-volume tasks", input: 0.10, output: 0.50, for_es: "tareas acotadas y de gran volumen"}
      - {model: "GPT-6.1 Terra", vendor: OpenAI, for: "visual reasoning, precise computer use, and clear, natural writing", input: 1, output: 5, for_es: "razonamiento visual, uso preciso de la computadora y redacción clara y natural"}
      - {model: "GPT-6.1 Sol", vendor: OpenAI, for: "near-Astra performance for complex work at a lower cost", input: 2, output: 10, for_es: "un rendimiento cercano al de Astra para trabajo complejo, a menor costo"}
      - {model: "GPT-6 Astra", vendor: OpenAI, for: "the most demanding work", input: 10, output: 50, for_es: "el trabajo más exigente"}


# Facts that change: prices, plans, accounts and free allowances, each with its source and the
# date it was checked. Chapters quote them with scripts/facts.py (`fact()`, `checked()`), and
# Appendix K (appendices/k-facts.qmd) prints them all, so updating one is one edit here and a
# rebuild (`make book`; `make deck` for the landing page, which reads this file too).
#
# Every entry has `checked` (YYYY-MM-DD) and `url` (the official page it was checked on). A
# `text` is a phrase that reads in a sentence; tables hold rows. When you re-check an entry,
# change its date even if the fact has not changed.


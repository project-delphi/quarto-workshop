      text_es: "OpenCode, un proveedor conectado desde dentro con /connect: un plan de ChatGPT, GitHub Copilot, una clave de API, un modelo local o una cuenta de OpenCode"
      url: https://opencode.ai/docs/providers/
      checked: 2026-11-20
    opencode_free:
      label: "OpenCode's free models"
      label_es: "Los modelos gratuitos de OpenCode"
      text: "OpenCode lists models that are free for a limited time once an OpenCode account is connected, and the list changes from week to week"
      text_es: "OpenCode ofrece modelos gratuitos por tiempo limitado una vez conectada una cuenta de OpenCode, y la lista cambia de una semana a otra"

models:
  title: "Models and their prices"
  items:
    everyday_models:
      label: "Models enough for this book's prompts"
      text: "Claude's Sonnet on medium effort, or Haiku for small edits, or OpenAI's Sol on low"
      url: https://platform.claude.com/docs/en/about-claude/models/overview
      also: [https://developers.openai.com/api/docs/models]
      checked: 2026-11-12
    vendor_starting_points:
      label: "Where the vendors suggest starting for hard work"
      text: "Anthropic suggests starting with Opus 5.5 for most workloads, and OpenAI with GPT-6 Astra for complex reasoning and coding"
      url: https://platform.claude.com/docs/en/about-claude/models/overview
      also: [https://developers.openai.com/api/docs/models]
      checked: 2026-11-12
  prices:
    caption: "List prices of eight models, in dollars per million tokens of input and output"
    url: https://platform.claude.com/docs/en/about-claude/pricing
    also: [https://platform.claude.com/docs/en/about-claude/models/overview, https://developers.openai.com/api/docs/models]
    checked: 2026-11-12
    note: >-
      Haiku's price is for prompts up to 100,000 tokens; longer ones cost five times as much.
      Subscriptions count usage differently from API prices, and which models you can choose
      depends on your plan and the agent's version.
    rows:
      - {model: "Claude Haiku 5.5", vendor: Anthropic, for: "high-volume, latency-sensitive tasks such as classification, extraction, and routing", input: 0.10, output: 0.50}
      - {model: "Claude Sonnet 5.5", vendor: Anthropic, for: "the best combination of speed and intelligence", input: 2, output: 10}
      - {model: "Claude Opus 5.5", vendor: Anthropic, for: "long-running agentic coding and knowledge work", input: 4, output: 20}
      - {model: "Claude Fable 5.2", vendor: Anthropic, for: "demanding reasoning and long-horizon agentic work", input: 8, output: 40}
      - {model: "GPT-6 Luna", vendor: OpenAI, for: "focused, high-volume tasks", input: 0.10, output: 0.50}
      - {model: "GPT-6.1 Terra", vendor: OpenAI, for: "visual reasoning, precise computer use, and clear, natural writing", input: 1, output: 5}
      - {model: "GPT-6.1 Sol", vendor: OpenAI, for: "near-Astra performance for complex work at a lower cost", input: 2, output: 10}
      - {model: "GPT-6 Astra", vendor: OpenAI, for: "the most demanding work", input: 10, output: 50}


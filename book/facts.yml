    antigravity_free:
      label: "Antigravity's free tier"
      label_es: "El nivel gratuito de Antigravity"
      text: "a personal Google account can use Antigravity on its free tier, with a quota refreshed weekly"
      text_es: "una cuenta personal de Google puede usar Antigravity en su nivel gratuito, con una cuota que se renueva cada semana"

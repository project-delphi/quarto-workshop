# Pide, revisa, publica: the Spanish edition of the book in book/ (translation/PLAN.md).
# A sibling of book/ at the same depth, so the cells' paths (../examples/...) and the
# chapter files' paths are the English edition's. Shared folders (scripts, filters, styles,
# assets and most of media/) are symlinks into book/; media/diagrams, media/roadmaps,
# media/qr and the cover are the Spanish ones. The chapter lists come from
# book/_chapters.yml (book/scripts/sync_chapters.py --book ../book-es). Build with
# `make book-es` from the repository root.
project:
  type: book
  execute-dir: project
  resources:
    - media/gifs/*.gif
    - media/stills/*.png
    - assets/*.js

profile:
  default: html

book:
  title: "Pide, revisa, publica"
  subtitle: "Publicación reproducible de datos con Quarto y asistentes de programación con IA"
  author: "Ravi Kalia"
  date: "2026-11-14"
  output-file: "prompt-check-publish-es"
  site-url: https://project-delphi.github.io/quarto-workshop/book/es/
  repo-url: https://github.com/project-delphi/quarto-workshop
  repo-subdir: book-es
  search: true
  page-navigation: true
  sidebar:
    tools:
      - icon: book
        text: "La página del libro"
        href: https://project-delphi.github.io/quarto-workshop/ebook/es/
      - icon: download
        text: "Descarga el EPUB"
        href: https://github.com/project-delphi/quarto-workshop/releases/latest/download/prompt-check-publish-es.epub

description: >-
  Una guía práctica de publicación reproducible: escribe una sola vez en Markdown, deja que
  un asistente de programación escriba el código, revisa su trabajo y reconstruye una sola
  fuente como página web, Word, PDF, diapositivas, libro electrónico, sitio web, blog y
  dashboard. Dos proyectos reales recorren el libro: una guía para visitantes de Londres y un
  estudio del riesgo del agua potable en los municipios de Colombia.
lang: es
rights: "© 2026 Ravi Kalia. Todos los derechos reservados."
keywords:
  - Quarto
  - publicación reproducible
  - asistentes de programación
  - Markdown
  - Python
  - EPUB
  - análisis de datos
  - k-means

# Quarto's Spanish labels, where they read as Spain's Spanish or a literal translation.
language:
  search-no-results-text: "No hay resultados"
  toggle-navigation: "Mostrar u ocultar la navegación"
  repo-action-links-issue: "Reportar un problema"

number-sections: true
crossref:
  chapters: true

execute:
  echo: false
  warning: true
  error: false
  cache: false
  freeze: auto

filters:
  - path: filters/book.lua
    at: pre-ast
  - path: filters/anim.lua
    at: post-quarto

format:
  html:
    theme:
      light: [cosmo, styles/book.scss]
      dark: [darkly, styles/book-dark.scss]
    code-copy: true
    code-overflow: wrap
    default-image-extension: svg
    fig-format: svg
    reference-location: margin
  epub:
    css: styles/epub.css
    identifier: "urn:uuid:5b0c2f7e-3d1a-4f6e-9c8b-2a7d4e1f6c93"
    publisher: "Ravi Kalia"
    epub-cover-image: media/cover.png
    subject: "Investigación reproducible; Publicación electrónica; Análisis de datos; Quarto; Inteligencia artificial"
    epub-title-page: true
    toc: true
    toc-title: "Contenido"
    default-image-extension: png
    fig-format: png
    fig-dpi: 200
    toc-depth: 2

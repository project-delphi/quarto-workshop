<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 740" role="img" aria-labelledby="t d">
<title id="t">Pide, revisa, publica</title>
<desc id="d">El ciclo que enseña este libro, en cada paso de los dos proyectos. Pide: le pides a un agente de programación un paso pequeño, nombrando los archivos y las columnas y terminando con una comprobación; Capítulo 2. El agente hace el trabajo: escribe archivos y ejecuta comandos. Revisa: lees lo que cambió, abres el resultado y lo comparas con los datos; este paso siempre es tuyo. Si no está bien, corriges el prompt, o te pones al día desde un punto de control, y vuelves a pedir. La fuente revisada pasa a Publica: Quarto reconstruye cada salida a partir de ella con quarto render, siempre de la misma manera; Capítulo 1. Luego el siguiente paso empieza con un prompt nuevo.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2416b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .m { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .h { font-size: 27px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .tag { font-size: 19px; font-weight: 600; letter-spacing: 1px; fill: #5b6b7b; }
  .rl { font-size: 19px; font-weight: 600; fill: #c2416b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .back { stroke: #c2416b; stroke-width: 2.5; fill: none; marker-end: url(#r); stroke-dasharray: 8 6; }
</style>
<!-- the return to the next step (right) and the fix branch (left), drawn first so the nodes sit on top -->
<path class="arrow" d="M530,535 C665,535 665,95 534,95"/>
<rect x="580" y="296" width="110" height="38" rx="19" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.5"/>
<text x="635" y="322" text-anchor="middle" class="n">otro paso</text>
<path class="back" d="M190,315 C40,315 40,95 186,95"/>
<rect x="14" y="186" width="150" height="62" rx="14" fill="#ffffff" stroke="#c2416b" stroke-width="1.5"/>
<text x="89" y="211" text-anchor="middle" class="rl">¿no está bien?</text>
<text x="89" y="236" text-anchor="middle" class="n">corrígelo</text>
<!-- Prompt -->
<rect x="190" y="20" width="340" height="150" rx="14" fill="#efeafc" stroke="#7c5cdb" stroke-width="2.5"/>
<text x="210" y="50" class="tag">TÚ → AGENTE</text>
<text x="510" y="50" text-anchor="end" class="n">Cap. 2</text>
<text x="360" y="92" text-anchor="middle" class="h">Pide</text>
<text x="360" y="124" text-anchor="middle" class="s">un paso pequeño, con archivos,</text>
<text x="360" y="151" text-anchor="middle" class="s">y una comprobación al final</text>
<path class="arrow" d="M360,170 L360,236"/>
<text x="374" y="210" class="n">el agente trabaja</text>
<!-- Check -->
<rect x="190" y="240" width="340" height="150" rx="14" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="210" y="270" class="tag">TÚ</text>
<text x="510" y="270" text-anchor="end" class="n">Cap. 2</text>
<text x="360" y="312" text-anchor="middle" class="h">Revisa</text>
<text x="360" y="344" text-anchor="middle" class="s">lee lo que cambió, abre el</text>
<text x="360" y="371" text-anchor="middle" class="s">resultado, compáralo con los datos</text>
<path class="arrow" d="M360,390 L360,456"/>
<text x="374" y="430" class="n">la fuente revisada</text>
<!-- Publish -->
<rect x="190" y="460" width="340" height="150" rx="14" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="210" y="490" class="tag">QUARTO</text>
<text x="510" y="490" text-anchor="end" class="n">Cap. 1</text>
<text x="360" y="532" text-anchor="middle" class="h">Publica</text>
<text x="360" y="564" text-anchor="middle" class="s"><tspan class="m">quarto render</tspan> reconstruye cada</text>
<text x="360" y="591" text-anchor="middle" class="s">salida, siempre de la misma manera</text>
<!-- footer -->
<text x="360" y="672" text-anchor="middle" class="s">Pasos pequeños, cada uno revisado,</text>
<text x="360" y="702" text-anchor="middle" class="s">cada salida reconstruida desde una sola fuente.</text>
</svg>

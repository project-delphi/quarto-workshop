<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="t d">
<title id="t">Qué más podría explicarlo</title>
<desc id="d">La pregunta es si el agua insegura aumenta la mortalidad infantil, una flecha discontinua de la calidad del agua a las muertes infantiles. Otros caminos conectan las dos. La pobreza y lo rural hacen el agua menos segura y también hacen más probables las muertes infantiles, así que pueden crear una asociación sin ningún efecto del agua: una variable de confusión. La pobreza también limita el acceso a los servicios de salud, que afecta las muertes infantiles. Y la pobreza debilita la calidad del registro: los lugares con un registro débil anotan menos de sus muertes reales, y las tasas vacías quedan fuera de los datos, lo que puede esconder un efecto real. Por último, los datos se encuentran en niveles distintos: el IRCA se mide para una zona y la mortalidad infantil para todo el municipio, así que un patrón entre lugares no tiene por qué valer para las personas que viven en ellos.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2416b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 23px; font-weight: 700; }
  .s { font-size: 19px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .ql { font-size: 19px; font-weight: 600; fill: #c2416b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
  .q { stroke: #c2416b; stroke-width: 3; fill: none; marker-end: url(#q); stroke-dasharray: 8 6; }
</style>
<!-- the confounder and its paths -->

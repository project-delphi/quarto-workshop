<text x="350" y="50" text-anchor="middle" class="h">Pobreza, lo rural</text>
<text x="350" y="80" text-anchor="middle" class="n">confusión: afecta a las dos</text>
<path class="arrow" d="M235,100 C190,150 175,190 172,236"/>
<path class="arrow" d="M470,100 C560,115 640,150 640,236"/>
<path class="arrow" d="M350,100 L350,124"/>
<path class="arrow" d="M200,57 C40,57 40,150 40,416"/>
<rect x="250" y="128" width="200" height="72" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
<text x="350" y="158" text-anchor="middle" class="h">Acceso a</text>
<text x="350" y="186" text-anchor="middle" class="h">la salud</text>
<path class="arrow" d="M450,180 C500,190 530,205 545,236"/>
<!-- the question -->
<rect x="70" y="240" width="200" height="100" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="170" y="280" text-anchor="middle" class="h">Calidad del agua</text>
<text x="170" y="312" text-anchor="middle" class="s">IRCA, por zona</text>
<rect x="470" y="240" width="210" height="100" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="575" y="280" text-anchor="middle" class="h">Muertes infantiles</text>
<text x="575" y="312" text-anchor="middle" class="s">reales, por municipio</text>
<path class="q" d="M270,310 L464,310"/>
<text x="368" y="296" text-anchor="middle" class="ql">¿la pregunta?</text>
<!-- what the data hold -->
<path class="arrow" d="M600,340 L600,416"/>
<rect x="20" y="420" width="310" height="96" rx="12" fill="#efeafc" stroke="#7c5cdb" stroke-width="2"/>
<text x="175" y="458" text-anchor="middle" class="h">Calidad del registro</text>
<text x="175" y="490" text-anchor="middle" class="s">un registro débil esconde muertes</text>
<path class="arrow" d="M330,468 L396,468"/>
<rect x="400" y="420" width="280" height="96" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2" stroke-dasharray="7 5"/>
<text x="540" y="458" text-anchor="middle" class="h">Muertes registradas</text>
<text x="540" y="490" text-anchor="middle" class="s">lo que contienen los datos</text>
<text x="540" y="546" text-anchor="middle" class="n">las tasas vacías quedan fuera</text>
<!-- level -->
<rect x="20" y="580" width="660" height="100" rx="12" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="350" y="622" text-anchor="middle" class="s">Nivel ecológico: IRCA por zona, muertes por municipio.</text>
<text x="350" y="654" text-anchor="middle" class="n">Un patrón entre lugares no tiene por qué valer para su gente.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="t d">
<title id="t">¿Puede este archivo ir a este agente?</title>
<desc id="d">Un camino de decisión con dos preguntas. Pregunta 1: ¿el archivo es público, o puedes compartirlo? Si es así, pasa a la pregunta 2: ¿este agente, con este plan, tiene permiso para este archivo? Si las dos respuestas son sí, el agente puede trabajar con el archivo. Si alguna es no, trabaja sobre un sustituto sintético, un archivo inventado con las columnas del real y ninguna de sus filas, y renderiza tú el archivo real. La comprobación trata del archivo y del plan, no de tus intenciones.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
</defs>
<style>
  text { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #24313f; }
  .h { font-size: 22px; font-weight: 700; }
  .s { font-size: 20px; fill: #3d4b59; }
  .n { font-size: 19px; fill: #5b6b7b; }
  .arrow { stroke: #5b6b7b; stroke-width: 2.5; fill: none; marker-end: url(#a); }
</style>
<rect x="20" y="20" width="360" height="100" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="44" y="56" class="h">1. El archivo</text>
<text x="44" y="92" class="s">¿Es público o puedes compartirlo?</text>
<path class="arrow" d="M200,120 L200,200"/>
<text x="214" y="168" class="n">sí</text>
<rect x="20" y="200" width="360" height="110" rx="12" fill="#e6f1fa" stroke="#2f72b0" stroke-width="2.5"/>
<text x="44" y="236" class="h">2. El agente</text>
<text x="44" y="268" class="s">¿Este agente, con este plan,</text>
<text x="44" y="294" class="s">tiene permiso para este archivo?</text>
<path class="arrow" d="M200,310 L200,390"/>
<text x="214" y="358" class="n">sí</text>
<rect x="20" y="390" width="360" height="90" rx="12" fill="#e3f4ed" stroke="#2f9e77" stroke-width="2.5"/>
<text x="44" y="426" class="h">Adelante</text>
<text x="44" y="458" class="s">El agente puede usar el archivo.</text>
<path class="arrow" d="M380,70 L452,70"/>
<text x="416" y="58" text-anchor="middle" class="n">no</text>
<path class="arrow" d="M380,255 L452,255"/>
<text x="416" y="243" text-anchor="middle" class="n">no</text>
<rect x="456" y="20" width="224" height="290" rx="12" fill="#fdf1dc" stroke="#d9890b" stroke-width="2.5"/>
<text x="476" y="56" class="h">Déjalo fuera</text>
<text x="476" y="94" class="s">Trabaja sobre un</text>
<text x="476" y="120" class="s">sustituto sintético:</text>
<text x="476" y="146" class="s">las columnas reales,</text>
<text x="476" y="172" class="s">sin ninguna fila.</text>
<text x="476" y="214" class="s">Renderiza tú</text>
<text x="476" y="240" class="s">el archivo real.</text>
<text x="350" y="530" text-anchor="middle" class="n">Las preguntas tratan del archivo y del plan, no de tus intenciones.</text>
</svg>
